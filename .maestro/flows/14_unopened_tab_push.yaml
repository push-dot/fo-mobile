appId: app.push.mobile
name: 봇으로 시작 → 홈을 열기 전에 그 탭으로 이동 → 탭 첫 화면 유지
---
# A launch into 봇 leaves 홈 unopened; opening 채용공고 from there must keep the feed under it.
- runFlow: _login.yaml
- stopApp
- openLink: push://bots
- extendedWaitUntil:
    visible: "(동의하고 시작하기|새 회사 Bot 만들기)"
    timeout: 60000
- runFlow: _dismiss_logbox.yaml
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "새 회사 Bot 만들기"
    timeout: 10000
- takeScreenshot: 14_unopened_tab_push-01
- openLink: push://jobs
- extendedWaitUntil:
    visible: "채용공고"
    timeout: 20000
- tapOn: "뒤로"
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "홈"
      READY: "새로 올라온 공고"
- assertNotVisible: "공고 .*개"
- takeScreenshot: 14_unopened_tab_push-02

appId: app.push.mobile
name: 홈 → 검색 → 많이 찾는 검색어 → 결과
---
- runFlow: _login.yaml
- tapOn: "검색"
- extendedWaitUntil:
    visible: "지금 많이 찾는 검색어"
    timeout: 10000
- takeScreenshot: 06_search_trending-01
- tapOn: "1위 프론트엔드"
- extendedWaitUntil:
    visible: "‘프론트엔드’ 공고.*"
    timeout: 10000
# The closed tabs are not fetched, so their chips get the number from search/counts.
- extendedWaitUntil:
    visible: "사람 [0-9]+"
    timeout: 10000
- assertVisible: "게시글 [0-9]+"
- takeScreenshot: 06_search_trending-02

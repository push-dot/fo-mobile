appId: app.push.mobile
name: 자료 → 서류 삭제 → 되돌리기 → 검색 → 자료 없음 → 서류 올리기
---
# The bot home has no entry to the modal yet (A14 adds it), so the flow opens it by deep link.
- runFlow: _login.yaml
- openLink: push://materials
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서.pdf 자세히"
    timeout: 20000
- tapOn: "김서준_백엔드_이력서.pdf 자세히"
- extendedWaitUntil:
    visible: "서류로 들어가기"
    timeout: 10000
- assertVisible: "모아페이 Bot, 도토리증권 Bot"
- takeScreenshot: 09_materials_delete_undo_empty-01

- tapOn: "자료 삭제"
- extendedWaitUntil:
    visible: "‘김서준_백엔드_이력서.pdf’를 삭제할까요?"
    timeout: 5000
- takeScreenshot: 09_materials_delete_undo_empty-02
# A plain tap: _tap_sheet_button's "still visible?" check waits about 7 s, longer than the 5 s undo toast lives.
- tapOn: "삭제"
# The confirm and the detail sheet close, the row leaves the list, and the server keeps the file for 30 days.
- extendedWaitUntil:
    visible: "서류를 삭제했어요"
    timeout: 4000
- assertNotVisible: "김서준_백엔드_이력서.pdf 자세히"
- takeScreenshot: 09_materials_delete_undo_empty-03
- tapOn: "되돌리기"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서.pdf 자세히"
    timeout: 10000
- assertNotVisible: "서류로 들어가기"
- takeScreenshot: 09_materials_delete_undo_empty-04

# 자료 검색 rides above the keyboard. Behind the keyboard, the clear tap lands on a key and the list stays filtered.
- tapOn: "자료 검색.*"
- inputText: "github"
- extendedWaitUntil:
    notVisible: "김서준_백엔드_이력서.pdf 자세히"
    timeout: 10000
- assertVisible: "github.com 자세히"
- takeScreenshot: 09_materials_delete_undo_empty-05
- tapOn: "검색어 지우기"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서.pdf 자세히"
    timeout: 10000
- assertNotVisible: "검색어 지우기"

# The modal asks again each time it opens, so a fixture switch shows on the next open.
- tapOn: "닫기"
- extendedWaitUntil:
    visible: "새로 올라온 공고"
    timeout: 10000
- openLink: push://materials?mock=materials:none
- extendedWaitUntil:
    visible: "아직 자료가 없어요"
    timeout: 20000
- takeScreenshot: 09_materials_delete_undo_empty-06
- tapOn: "서류 올리기"
- extendedWaitUntil:
    visible: "서류 가져오기"
    timeout: 10000
- takeScreenshot: 09_materials_delete_undo_empty-07

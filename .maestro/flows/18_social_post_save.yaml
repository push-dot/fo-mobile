appId: app.push.mobile
name: 소셜 → 글 저장 → 저장한 글에 나타남 → 저장 해제
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "소셜"
      READY: "직장 생활"
- tapOn: "글쓰기"
- tapOn: "카테고리.*"
- tapOn: "개발"
- tapOn:
    id: "compose-title"
- inputText: "Maestro save post"
- tapOn:
    id: "compose-body"
- inputText: "Saved by the Maestro flow"
- tapOn: "게시"
- extendedWaitUntil:
    visible: ".*Maestro save post.*"
    timeout: 10000
- tapOn: ".*Maestro save post.*"
- tapOn: "더 보기"
- tapOn: "저장"
- extendedWaitUntil:
    visible: "저장했어요"
    timeout: 10000
- takeScreenshot: 18_social_post_save-01
- tapOn: "보기"
- assertVisible: ".*Maestro save post.*"
- takeScreenshot: 18_social_post_save-02
- tapOn: ".*Maestro save post.*"
- tapOn: "더 보기"
- tapOn: "저장 해제"
- extendedWaitUntil:
    visible: "저장을 해제했어요"
    timeout: 10000
- takeScreenshot: 18_social_post_save-03

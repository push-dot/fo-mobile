appId: app.push.mobile
name: 봇 홈에서 자료를 회사 봇에게 보내면 그 입력창에 붙고 봇 홈은 그대로 아래에 남는다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "Bot"
      READY: "(동의하고 시작하기|새 회사 Bot 만들기)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: ".*모아페이 Bot.*"
    timeout: 10000
- tapOn:
    text: "자료"
    index: 0
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서.pdf 보내기"
    timeout: 20000
- tapOn: "김서준_백엔드_이력서.pdf 보내기"
- extendedWaitUntil:
    visible: "어느 Bot한테 보낼까요?"
    timeout: 10000
- tapOn: "모아페이"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서.pdf"
    timeout: 15000
- takeScreenshot: 17_material_send
- tapOn: "뒤로"
- extendedWaitUntil:
    visible: ".*모아페이 Bot.*"
    timeout: 10000

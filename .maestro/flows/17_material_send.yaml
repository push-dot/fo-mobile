appId: app.push.mobile
name: 봇 홈에서 자료를 회사 봇에게 보내면 그 입력창에 붙고 봇 홈은 그대로 아래에 남는다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
# The chat asks the company-Bot consent on its first message (ChatConsentCompany); consent-on answers it ahead.
- openLink: push://bots?mock=consent-on
- extendedWaitUntil:
    visible: ".*모아페이 Bot.*"
    timeout: 10000
- tapOn:
    text: "자료"
    index: 0
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서 보내기"
    timeout: 20000
- tapOn: "김서준_백엔드_이력서 보내기"
- extendedWaitUntil:
    visible: "어느 Bot한테 보낼까요?"
    timeout: 10000
- tapOn: "모아페이"
- extendedWaitUntil:
    visible: "이 변경을 이력서에 반영할까요?"
    timeout: 15000
- runFlow: _dismiss_approval.yaml
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서 첨부 빼기"
    timeout: 15000
- takeScreenshot: 17_material_send
- tapOn: "뒤로"
- extendedWaitUntil:
    visible: ".*모아페이 Bot.*"
    timeout: 10000

appId: app.push.mobile
name: 봇 → 빠른 시작(공고 링크) → 변경 적용 → 완료
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
# The mock Push Bot thread is pre-seeded; bot:b-push:empty opens it as on first use, with the onboarding chips (links.ts).
- openLink: push://bots/push?mock=consent-on,bot:b-push:empty
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- takeScreenshot: 04_chat_quickstart-01
- tapOn: "공고 링크로 맞추기"
- tapOn: "공고 링크"
- inputText: "https://careers.moapay.kr/jobs/1182"
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "맞추기 시작"
- extendedWaitUntil:
    visible: "이렇게 고쳤어요"
    timeout: 60000
- takeScreenshot: 04_chat_quickstart-02
# The edit modal slides up; its one 적용 button answers, the title is not a tap target.
- waitForAnimationToEnd
- tapOn: "적용"
# The run's end asks what to do next in a sheet (ChatDoneNext) that hides the chat from the accessibility tree: wait for it, close it, then read the last message.
- extendedWaitUntil:
    visible: "프로필을 다 고쳤어요"
    timeout: 60000
- takeScreenshot: 04_chat_quickstart-03-sheet
- runFlow:
    file: ../visual/_close_sheet.yaml
    env:
      TITLE: "프로필을 다 고쳤어요"
- extendedWaitUntil:
    visible: "다 됐어요.*"
    timeout: 10000
- takeScreenshot: 04_chat_quickstart-03

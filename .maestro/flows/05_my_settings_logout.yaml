appId: app.push.mobile
name: 마이 → 설정 → 로그아웃
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "마이"
      READY: "김서준"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- takeScreenshot: 05_my_settings_logout-01
- tapOn: "설정"
- scrollUntilVisible:
    element: "로그아웃"
    direction: DOWN
- tapOn: "로그아웃"
# Retap if the confirm alert did not open (dropped first tap, see _tap_sheet_button.yaml).
- runFlow:
    when:
      notVisible: "취소"
    commands:
      - tapOn: "로그아웃"
- extendedWaitUntil:
    visible: "취소"
    timeout: 5000
- takeScreenshot: 05_my_settings_logout-02
# iOS keeps the settings row under the alert in the hierarchy, so pick the alert's button.
- tapOn:
    text: "로그아웃"
    rightOf: "취소"
- extendedWaitUntil:
    visible: "Google로 시작하기"
    timeout: 10000
- takeScreenshot: 05_my_settings_logout-03

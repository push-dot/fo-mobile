appId: app.push.mobile
name: 탭 전환 후 상태와 스크롤 위치 유지
---
- runFlow: _login.yaml
# A section title scrolled under the top bar still shows a few points of its box, so the shortcut row (always above the titles) proves the scroll.
- scrollUntilVisible:
    element: "이번 주 많이 본 공고"
    direction: DOWN
    centerElement: true
- assertNotVisible: "채용공고"
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "마이"
      READY: "김서준"
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- takeScreenshot: 13_tab_state_kept-01
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "홈"
      READY: "이번 주 많이 본 공고"
- assertNotVisible: "채용공고"
- takeScreenshot: 13_tab_state_kept-02
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "마이"
      READY: "지원한 공고"
- takeScreenshot: 13_tab_state_kept-03

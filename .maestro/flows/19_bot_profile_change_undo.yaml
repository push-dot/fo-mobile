appId: app.push.mobile
name: 봇이 프로필을 고치면 다시 열어도 되돌리기가 보이고, 누르면 값이 돌아온다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
# bot:b-push:empty opens the Push Bot as on first use; consent-on answers the consent ahead.
- openLink: push://bots/push?mock=consent-on,bot:b-push:empty
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
# The scripted run plays update_my_profile (mock chat/runs): the headline changes at once and the line offers 되돌리기.
- tapOn: "메시지.*"
- inputText: "change headline"
- hideKeyboard:
    optional: true
- tapOn: "보내기"
- extendedWaitUntil:
    visible: "프로필을 고쳤어요."
    timeout: 40000
# The run is over (reply shown) before the chat is left, so the reopen reads the stored turn, not a run still going.
- extendedWaitUntil:
    visible: "한 줄 소개를 바꿨어요."
    timeout: 15000
- extendedWaitUntil:
    visible: "되돌리기"
    timeout: 15000
- takeScreenshot: 19_bot_profile_change_undo-01
- tapOn: "뒤로"
# Reopen: the chat's client copy is dropped (bot:b-push:reload), so the thread comes from the stored turns and the change id from the tool line.
- openLink: push://bots/push?mock=bot:b-push:reload
- extendedWaitUntil:
    visible: "한 줄 소개를 바꿨어요."
    timeout: 15000
- extendedWaitUntil:
    visible: "되돌리기"
    timeout: 15000
- takeScreenshot: 19_bot_profile_change_undo-02
- tapOn: "되돌리기"
- extendedWaitUntil:
    visible: "되돌렸어요"
    timeout: 15000
- assertNotVisible: "되돌리기"
- takeScreenshot: 19_bot_profile_change_undo-03
# The undo answer is the profile as the server has it now: the editor must read the old headline, not the Bot's.
- openLink: push://edit-profile/basic
- extendedWaitUntil:
    visible: "결제 시스템을 만드는 백엔드 개발자"
    timeout: 15000
- assertNotVisible: "결제·정산 시스템을 만드는 시니어 백엔드 개발자"
- takeScreenshot: 19_bot_profile_change_undo-04

appId: app.push.mobile
name: Bot 홈에서 채팅을 열고 돌아오면 행이 그 채팅의 마지막 말을 보여 준다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
# The chat asks the company-Bot consent on its first open (ChatConsentCompany); consent-on answers it ahead.
- openLink: push://bots?mock=consent-on
# 누리클라우드 has no pending approval and no run, so nothing opens over its chat. Its newest line is unread.
- extendedWaitUntil:
    visible: ".*누리클라우드 Bot, 완료, 안 읽음, .*자기소개서 초안 v2를 만들었어요.*"
    timeout: 10000
- tapOn: ".*누리클라우드 Bot.*"
- extendedWaitUntil:
    visible: "자기소개서 초안 v2를 만들었어요"
    timeout: 15000
- tapOn: "뒤로"
# Opening the chat read it: the row keeps its line and loses the unread state. (A typed line is not asserted: the mock send runs in the app, never in the mock server.)
- extendedWaitUntil:
    visible: ".*누리클라우드 Bot, 대기, .*자기소개서 초안 v2를 만들었어요.*"
    timeout: 15000
- assertNotVisible: ".*누리클라우드 Bot, 완료, 안 읽음.*"
- takeScreenshot: 15_bot_home_open_chat

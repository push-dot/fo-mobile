appId: app.push.mobile
name: Bot 홈에서 채팅을 열고 돌아오면 행이 그 말을 보여 준다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
# The chat asks the company-Bot consent on its first message (ChatConsentCompany); consent-on answers it ahead.
- openLink: push://bots?mock=consent-on
- extendedWaitUntil:
    visible: ".*누리클라우드 Bot.*"
    timeout: 10000
# 모아페이 holds a pending approval whose question the row keeps showing (확인 필요), so this flow uses a Bot with none.
- tapOn: ".*누리클라우드 Bot.*"
- extendedWaitUntil:
    visible: "메시지.*"
    timeout: 15000
- tapOn: "메시지.*"
- inputText: "홈행확인"
- tapOn: "보내기"
- waitForAnimationToEnd
- takeScreenshot: dbg15-sent
- tapOn: "뒤로"
- takeScreenshot: dbg15-home
- extendedWaitUntil:
    visible: "홈행확인"
    timeout: 15000
- takeScreenshot: 15_bot_home_open_chat

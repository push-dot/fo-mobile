appId: app.push.mobile
name: Bot 홈에서 채팅을 열고 돌아오면 행이 그 말을 보여 준다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "봇"
      READY: "(동의하고 시작하기|새 회사 Bot 만들기)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: ".*모아페이 Bot.*"
    timeout: 10000
- tapOn: ".*모아페이 Bot.*"
- extendedWaitUntil:
    visible: "메시지.*"
    timeout: 15000
- tapOn: "메시지.*"
- inputText: "홈행확인"
- tapOn: "보내기"
- tapOn: "뒤로"
- extendedWaitUntil:
    visible: "홈행확인"
    timeout: 15000
- takeScreenshot: 15_bot_home_open_chat

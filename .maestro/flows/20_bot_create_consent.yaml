appId: app.push.mobile
name: 동의 없이 Bot을 만들면 동의를 다시 묻고, 동의하면 그 Bot이 만들어진다
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
# No consent-on: POST bots answers 403 CONSENT_REQUIRED (mock/bots.ts), the page asks again and retries with the same form.
- openLink: push://bots/new
- extendedWaitUntil:
    visible: "Bot 만들기"
    timeout: 20000
- tapOn: "회사, 공고, 링크로 찾아보세요"
- inputText: "새벽"
- extendedWaitUntil:
    visible: ".*ML 엔지니어.*"
    timeout: 20000
- tapOn: ".*ML 엔지니어.*"
- extendedWaitUntil:
    visible: "만들기"
    timeout: 10000
- tapOn: "만들기"
- extendedWaitUntil:
    visible: "동의하고 시작하기"
    timeout: 15000
- assertVisible: ".*동의가 필요해요.*"
- assertNotVisible: "새벽마켓 Bot에게 물어보기"
- tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "새벽마켓 Bot에게 물어보기"
    timeout: 20000
- assertVisible: ".*새벽마켓.*"

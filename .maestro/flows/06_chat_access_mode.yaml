appId: app.push.mobile
name: 봇 → 실행 방식 시트 → 항상 묻기
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "봇"
      READY: "(동의하고 시작하기|실행 방식, .*)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "실행 방식, .*"
    timeout: 10000
- takeScreenshot: 06_chat_access_mode-01
- tapOn: "실행 방식, .*"
# Native form sheet: iOS grabber sheet, Android Material bottom sheet.
- extendedWaitUntil:
    visible: "봇이 어떻게 실행할까요?"
    timeout: 5000
- takeScreenshot: 06_chat_access_mode-02
# Each option reads as one label: name and description.
- tapOn: "항상 묻기.*"
- extendedWaitUntil:
    notVisible: "봇이 어떻게 실행할까요?"
    timeout: 5000
- assertVisible: "실행 방식, 항상 묻기"

appId: app.push.mobile
name: 봇 · 오류 (사용 불가 · 그 밖의 오류 · 사용량 소진 · 읽기 실패)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
# The boards draw the user's own request above each error; run:<token> makes the mock answer it with that error (Android types the ASCII alias).
- openLink: push://bots/push?mock=run:err-unavailable
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "err-unavailable"
- extendedWaitUntil:
    visible: "지금은 Bot을 쓸 수 없어요.*"
    timeout: 20000
# The board has no keyboard; a tap on the user's own bubble lowers it (a tap on a bot line would open the profile).
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*이력서 고쳐 주세요.*"
- waitForAnimationToEnd
- takeScreenshot: ChatErrUnavailable
- runFlow: _fresh_chat.yaml
- openLink: push://bots/push?mock=run:err-other
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "err-other"
- extendedWaitUntil:
    visible: "작업을 이어가지 못했어요.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatErrOther
- runFlow: _fresh_chat.yaml
- openLink: push://bots/push?mock=run:err-credit
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력기술서도 써 줘"
      EN: "err-credit"
- extendedWaitUntil:
    visible: "이번 달 사용량을 모두 썼어요.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatBotHeaderLimit
- runFlow: _fresh_chat.yaml
- openLink: push://bots/push?mock=reset,bot:push:empty
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "fail"
      BOT: "push"
      KO: "이 채용 페이지 읽고 이력서 고쳐 줘"
      EN: "fail" # the mock reads ^fail$ as the failed read; run1:fail is not a TOKENS key, the typed text decides
- extendedWaitUntil:
    visible: "어떻게 할까요?"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: ChatErrors

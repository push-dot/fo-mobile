appId: app.push.mobile
name: 봇 홈 · 큰 글씨
tags:
  - visual
---
# Run with the system text size raised (xl/ is a separate run).
- runFlow:
    file: ../_login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on"
      READY: "새로 올라온 공고"
- runFlow:
    file: ../../flows/_tap_tab.yaml
    env:
      TAB: "Bot"
      READY: "새 회사 Bot 만들기"
- extendedWaitUntil:
    visible: ".*Push Bot.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: AgentHomeXL

appId: app.push.mobile
name: 공고 상세 · 큰 글씨
tags:
  - visual
---
# Run with the system text size raised (xl/ is a separate run).
# The board draws the three-part fit card (G74).
- runFlow:
    file: ../_login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=fit-three"
      READY: "새로 올라온 공고"
- runFlow: ../_open_jobs.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- tapOn:
    text: ".*모아페이.*"
    index: 0
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Kafka 운영 경험과 부하 테스트 근거가 부족해요.*"
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: JobDetailXL.1
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: JobDetailXL.2

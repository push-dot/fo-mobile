appId: app.push.mobile
name: 소셜 → 글쓰기 시트
tags:
  - visual
---
# The board draws 커리어 with the title and body still on their placeholders (제목을 입력해 주세요 / 나누고 싶은 이야기를 적어 주세요),
# no keyboard, and two photos (2/4); an earlier tour typed both fields, which no panel shows. (The board's 게시 is on although both
# fields are empty; the app keeps it off until a title and a body exist.) mock=two-photos makes the next photo pick return
# two images instead of the system picker (whose labels the app does not set); the pick is the last step.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- openLink: push://?mock=two-photos
- tapOn: "소셜"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "글쓰기"
- extendedWaitUntil:
    visible: "새 글"
    timeout: 10000
- tapOn: "카테고리.*"
- tapOn: "커리어"
- waitForAnimationToEnd
- tapOn: "사진 추가.*"
- extendedWaitUntil:
    visible: "사진 추가, 2/4"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ComposeSheet

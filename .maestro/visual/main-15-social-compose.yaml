appId: app.push.mobile
name: 소셜 → 글쓰기 시트
tags:
  - visual
---
# The board draws the filled sheet: 커리어, a title and a body (게시 on), and two photos (2/4). The photos come from the system picker, so the
# simulator's library gets two images first (addMedia); the picker is the last step, which also leaves the keyboard down for the shot.
- addMedia:
    - ../../assets/icon.png
    - ../../assets/splash-icon.png
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "소셜"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "글쓰기"
- extendedWaitUntil:
    visible: "새 글"
    timeout: 10000
- tapOn: "카테고리.*"
- tapOn: "커리어"
- waitForAnimationToEnd
- tapOn:
    id: "compose-title"
- inputText: "결제 도메인으로 이직한 후기"
- tapOn:
    id: "compose-body"
- inputText: "정산 배치를 맡으며 배운 것을 정리했어요"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "사진 추가.*"
      # The system picker lists the newest photo first; tap two, then 추가.
      - extendedWaitUntil:
          visible: "사진, .*"
          timeout: 15000
      - tapOn:
          text: "사진, .*"
          index: 0
      - tapOn:
          text: "사진, .*"
          index: 1
      - tapOn: "추가"
      - extendedWaitUntil:
          visible: "사진 추가, 2/4"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ComposeSheet

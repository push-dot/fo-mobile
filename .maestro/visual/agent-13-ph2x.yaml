appId: app.push.mobile
name: 봇 · 경험 만들기 · 접근 → 병목 강도 → 검증 실패 → 기획서 고르기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "필요한 프로젝트 경험까지 만들어 주세요"
      EN: "ph2x"
- extendedWaitUntil:
    visible: "어떤 방식으로 경험을 만들까요?"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
- takeScreenshot: ChatPh2XApproach
- runFlow:
    file: _pick.yaml
    env:
      ASK: "어떤 방식으로 경험을 만들까요?"
      PICK: ".*병목 만들기"
      NEXT: "병목 강도를 어느 정도로 할까요?"
- waitForAnimationToEnd
- takeScreenshot: ChatPh2XLevel
# The first pick fails verification in the mock (a bubble, then the 어떻게 할까요? modal); 다시 시도 passes and goes on to the blueprints.
- runFlow:
    file: _pick.yaml
    env:
      ASK: "병목 강도를 어느 정도로 할까요?"
      PICK: ".*중간 제약"
      NEXT: ".*검증을 통과하지 못했어요.*"
- waitForAnimationToEnd
- runFlow:
    file: _pick.yaml
    env:
      ASK: "어떻게 할까요?"
      PICK: ".*다시 시도"
      NEXT: "어떤 프로젝트를 구현할까요?"
- waitForAnimationToEnd
- takeScreenshot: ChatPh2XBlueprints
# ChatVerifyFail draws the failed check under the 중간 제약으로 line alone, so it jumps there in a fresh conversation (mock token).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "중간 제약으로"
      EN: "verify-fail"
- extendedWaitUntil:
    visible: ".*검증을 통과하지 못했어요.*"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
- takeScreenshot: ChatVerifyFail

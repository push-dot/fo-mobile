appId: app.push.mobile
name: 봇 · 경험 만들기 · 접근 → 병목 강도 → 검증 실패 → 기획서 고르기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "필요한 프로젝트 경험까지 만들어 주세요"
      EN: "ph2x"
- extendedWaitUntil:
    visible: "어떤 방식으로 경험을 만들까요?"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
- takeScreenshot: ChatPh2XApproach
- runFlow:
    file: _pick.yaml
    env:
      ASK: "어떤 방식으로 경험을 만들까요?"
      PICK: ".*병목 만들기"
      NEXT: "병목 강도를 어느 정도로 할까요?"
- waitForAnimationToEnd
- takeScreenshot: ChatPh2XLevel
# The first pick fails verification in the mock: the failed check, then the 어떻게 할까요? modal (the next block shoots it on a short thread).
- runFlow:
    file: _pick.yaml
    env:
      ASK: "병목 강도를 어느 정도로 할까요?"
      PICK: ".*중간 제약"
      NEXT: "어떻게 할까요?"
- waitForAnimationToEnd
# ChatVerifyFail draws the failed check under the 중간 제약으로 line alone, so it jumps there in a fresh conversation (mock token).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "중간 제약으로"
      EN: "verify-fail"
# The modal hides the thread from the accessibility tree: wait for the modal, not for the bubble under it.
- extendedWaitUntil:
    visible: "어떻게 할까요?"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
- takeScreenshot: ChatVerifyFail
# ChatPh2XBlueprints draws the blueprints right under the user's line, so it shoots a fresh conversation without the failed check before them (mock token).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "기획서 보여 줘"
      EN: "ph2x-blueprints"
- extendedWaitUntil:
    visible: "어떤 프로젝트를 구현할까요?"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
- takeScreenshot: ChatPh2XBlueprints

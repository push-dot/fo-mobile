appId: app.push.mobile
name: 봇 · Android 키보드가 떠 있을 때 입력창이 키보드 바로 위
tags:
  - visual
---
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ../flows/_login.yaml
      - runFlow: _company_tab.yaml
      - runFlow:
          file: _say.yaml
          env:
            KO: "ext-done"
            EN: "ext-done"
      - extendedWaitUntil:
          visible: "프로필로 전환"
          timeout: 30000
      - waitForAnimationToEnd
      - runFlow: _dismiss_next.yaml
      # The keyboard stays up for both shots (a one-line and a multi-line input).
      - tapOn: "메시지.*"
      - inputText: "Tailor it for Nuri Cloud too"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardAndroid.1
      - inputText: " but leave my career statement as it is and only fix the resume, please"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardAndroid.2

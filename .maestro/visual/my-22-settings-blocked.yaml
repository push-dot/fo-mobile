appId: app.push.mobile
name: 마이 설정 → 차단한 사람 → 빈 차단 목록
tags:
  - visual
---
# The mock starts with 2 blocked people. It has no company (push-be GET me/blocks sends none), so the rows read "{date} 차단" only.
# The board has 참고 데이터 제공 on.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on"
      READY: "새로 올라온 공고"
- openLink: push://settings
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
# Board ink centre is 591; a slow swipe moves the list ~0.857 of its travel, so 12% of 874 (105pt) lands the row near 594.
- scrollUntilVisible:
    element: "차단한 사람.*"
    centerElement: true
- waitForAnimationToEnd
- swipe:
    start: "50%,45%"
    end: "50%,57%"
    duration: 1000
- waitForAnimationToEnd
- takeScreenshot: SettingsBlockedEntry
- tapOn: "차단한 사람.*"
- extendedWaitUntil:
    visible: "차단한 사람은 나에게 제안이나 메시지를 보낼 수 없어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SettingsBlocked

# Only GET me/blocks is emptied; the screens read it fresh on mount.
- openLink: push://social?mock=empty:GET:me/blocks
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "설정"
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
- runFlow: _settings_end.yaml
- tapOn: "차단한 사람.*"
- extendedWaitUntil:
    visible: "차단한 사람이 없어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SettingsBlockedEmpty
- openLink: push://?mock=reset

appId: app.push.mobile
name: 마이 설정 → 차단한 사람 → 빈 차단 목록
tags:
  - visual
---
# The mock starts with 2 blocked people. It has no company (push-be GET me/blocks sends none), so the rows read "{date} 차단" only.
# The board has 참고 데이터 제공 on.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on"
      READY: "새로 올라온 공고"
# The board is the entry state (the 차단한 사람 row bold on acSoft, route param entry=blocked), which a tap on 설정 never sets.
- openLink: push://settings?entry=blocked
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
# The board shows the list scrolled so that 댓글과 답글 is the first row under the title and the 차단한 사람 row sits at y≈533. scrollUntilVisible + centerElement stops with the row at
# y≈503.7 (measured on the step-4 capture of this flow, ink 496.7-510.7), so the list goes down ~29pt: a slow swipe moves the list ~0.86 of its
# travel (the 4% back-off in _settings_end.yaml is 35pt of travel = 30pt of list): 4% of 874 = 35pt -> 30pt -> row centre ~533.8 (board 533).
- scrollUntilVisible:
    element: "차단한 사람.*"
    centerElement: true
- waitForAnimationToEnd
- swipe:
    start: "50%,45%"
    end: "50%,49%"
    duration: 1000
- waitForAnimationToEnd
- takeScreenshot: SettingsBlockedEntry
- tapOn: "차단한 사람.*"
- extendedWaitUntil:
    visible: "차단한 사람은 나에게 제안이나 메시지를 보낼 수 없어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SettingsBlocked

# Only GET me/blocks is emptied; the screens read it fresh on mount.
- openLink: push://social?mock=empty:GET:me/blocks
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "설정"
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
- runFlow: _settings_end.yaml
- tapOn: "차단한 사람.*"
- extendedWaitUntil:
    visible: "차단한 사람이 없어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SettingsBlockedEmpty
- openLink: push://?mock=reset

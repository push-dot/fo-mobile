appId: app.push.mobile
name: 자료 · 목록 · 탭 · 검색 없음 · 추가 메뉴 · 링크 추가 · 자세히 · 삭제 확인
tags:
  - visual
---
# The bot home has no entry to the modal yet (A14 adds it), so the tour opens it by deep link.
- runFlow: ../flows/_login.yaml
- openLink: push://materials
- extendedWaitUntil:
    visible: "모아페이 · 백엔드 엔지니어 자세히"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: Materials
- tapOn: "서류"
- extendedWaitUntil:
    visible: "경력증명서_2025.pdf 자세히"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialsDocs
- tapOn: "북마크"
- extendedWaitUntil:
    visible: "파도AI · ML 플랫폼 엔지니어 자세히"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialsBookmarks
- tapOn: "링크"
- extendedWaitUntil:
    visible: "github.com/seojun-kim/pay-gw 자세히"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialsLinks
- tapOn: "github.com/seojun-kim 자세히"
- extendedWaitUntil:
    visible: "바로가기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialDetailLink
- runFlow:
    file: _close_sheet.yaml
    env:
      TITLE: "바로가기"
- tapOn: "전체"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서.pdf 자세히"
    timeout: 10000
- tapOn: "모아페이 · 백엔드 엔지니어 자세히"
- extendedWaitUntil:
    visible: "공고로 이동"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialDetailBookmark
- runFlow:
    file: _close_sheet.yaml
    env:
      TITLE: "공고로 이동"
- tapOn: "김서준_백엔드_이력서.pdf 자세히"
- extendedWaitUntil:
    visible: "서류로 들어가기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialDetailDoc
- tapOn: "자료 삭제"
- extendedWaitUntil:
    visible: "‘김서준_백엔드_이력서.pdf’를 삭제할까요?"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: MaterialDetailDelete
- tapOn: "취소"
- runFlow:
    file: _close_sheet.yaml
    env:
      TITLE: "서류로 들어가기"
- tapOn: "자료 추가"
- extendedWaitUntil:
    visible: "서류 올리기"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: MaterialsAdd
- tapOn: "링크 추가"
- extendedWaitUntil:
    visible: "추가하기"
    timeout: 5000
- inputText: "github.com/seojun-kim/payment-gateway"
- runFlow: _hide_kbd.yaml
- waitForAnimationToEnd
- takeScreenshot: MaterialsLinkAdd
# The modal's own 닫기 sits behind the sheet, so the sheet closes the way the others do.
- runFlow:
    file: _close_sheet.yaml
    env:
      TITLE: "추가하기"
- tapOn: "자료 검색"
- inputText: "회고 발표"
- runFlow: _hide_kbd.yaml
- extendedWaitUntil:
    visible: "‘회고 발표’와 맞는 자료가 없어요"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MaterialsSearchEmpty

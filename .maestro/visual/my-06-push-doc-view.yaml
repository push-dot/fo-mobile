appId: app.push.mobile
name: 마이 서류 → Push 서류 카드 → 서류 보기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: ".*다온뱅크.*"
    timeout: 10000
- tapOn: ".*다온뱅크.*"
- extendedWaitUntil:
    visible: "Bot한테 보내기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocView

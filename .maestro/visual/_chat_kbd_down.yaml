appId: app.push.mobile
tags:
  - subflow
# Lowers the chat keyboard after _say. iOS hideKeyboard fails and Return would send, so a tap on the static thread text ${TEXT}
# does it (the thread scroll view dismisses the keyboard on a tap outside the composer); Android does nothing (see below).
# The tap lands on nothing when the line has scrolled out of the keyboard-high thread (a tour once ended with the keyboard up
# where the board has none), so when a key is still on screen a drag down over the keyboard dismisses it (the thread list is
# keyboardDismissMode "interactive"). The boards have no keyboard, so no tour may leave one up.
# The key test names a key of the Korean layout (ㅂ, ㅁ, ㅋ, 123) as well as the space bar: ChatPh1 and ChatInterrupt kept their keyboard up in the
# step-5 run because the Korean space bar is not labelled "space" and so no key was found.
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: ${TEXT}
          optional: true
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "(스페이스|space|Space|123|ㅂ|ㅁ|ㅋ|q|a|z|return|Return|리턴)"
          commands:
            - swipe:
                start: "50%,35%"
                end: "50%,92%"
                duration: 400
# Android: _say already lowered the keyboard (hideKeyboard presses back when none is up and would leave the chat), so nothing to do.
- waitForAnimationToEnd

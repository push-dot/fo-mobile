appId: app.push.mobile
tags:
  - subflow
# Lowers the chat keyboard after _say. iOS hideKeyboard fails and Return would send, so a tap on the thread's left gutter does it: the
# gutter is the list's own 20pt side padding, so no bubble, pill or header button sits there (a tap on a line opened the Bot profile when
# the line had scrolled under the glass header), and the thread list dismisses the keyboard on a tap it does not handle. A drag down
# over the keyboard would scroll the thread to its first line, so a second gutter tap is the retry.
# The key test names a key of the Korean layout (ㅂ, ㅁ, ㅋ, 123) as well as the space bar: ChatPh1 and ChatInterrupt kept their keyboard up in the
# step-5 run because the Korean space bar is not labelled "space" and so no key was found.
# The boards have no keyboard, so no tour may leave one up. Android: _say already lowered the keyboard (hideKeyboard presses back when none
# is up and would leave the chat), so nothing to do.
---
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "(스페이스|space|Space|123|ㅂ|ㅁ|ㅋ|q|a|z|return|Return|리턴)"
          commands:
            - tapOn:
                point: "2%,30%"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "(스페이스|space|Space|123|ㅂ|ㅁ|ㅋ|q|a|z|return|Return|리턴)"
          commands:
            - tapOn:
                point: "2%,40%"
- waitForAnimationToEnd

appId: app.push.mobile
tags:
  - subflow
# A finished run asks "이력서를 다 고쳤어요" (the title, no sentence under it) in a regular modal (ChatDoneNext, no 취소); swipe it away to see the chat behind.
---
- runFlow:
    when:
      visible: "(이력서|프로필)를 다 고쳤어요"
    commands:
      - runFlow:
          file: _close_sheet.yaml
          env:
            TITLE: "(이력서|프로필)를 다 고쳤어요"
      - waitForAnimationToEnd

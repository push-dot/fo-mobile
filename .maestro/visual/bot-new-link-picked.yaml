appId: app.push.mobile
name: BotNewLinkPicked
tags:
  - visual
---
# The board picks 모아페이 · 백엔드 엔지니어 with the pink swatch. The 모아페이 Bot of the fixtures would open its chat instead of the form,
# so bots:none removes it; p-moa-short is the posting with the board's short title (mock/postings.ts).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=bots:none"
      READY: "새로 올라온 공고"
- openLink: push://bots/new?posting=p-moa-short
- extendedWaitUntil:
    visible: "백엔드 엔지니어"
    timeout: 20000
- tapOn: "pink"
- waitForAnimationToEnd
- takeScreenshot: BotNewLinkPicked

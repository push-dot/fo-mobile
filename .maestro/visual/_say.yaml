appId: app.push.mobile
tags:
  - subflow
# Types ${KO} on iOS and ${EN} on Android (inputText is ASCII-only there), then sends.
---
# Empty composer reads "메시지 <placeholder>" on iOS, typed text reads "메시지".
- tapOn: "메시지.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${KO}
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${EN}
      # The chat composer does not lift above the Android keyboard, so 보내기 is hidden until it is lowered.
      - hideKeyboard:
          optional: true
- tapOn: "보내기"
# A tap that lands while the keyboard is still settling can leave the typed line in the composer; tap again while the send button shows
# the line is still there (a sent line empties the composer, so a second tap sends nothing).
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "보내기"
    commands:
      - tapOn:
          text: "보내기"
          optional: true

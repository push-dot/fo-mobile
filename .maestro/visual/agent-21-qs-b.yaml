appId: app.push.mobile
name: 봇 · 빠른 시작 시트 (마감 · 현황 · 캘린더 · 허브)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "지원 현황 정리"
      WAIT: "3개 정리하기"
      SHOT: QsStatus
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "캘린더 관리"
      WAIT: "이번 주 3건"
      SHOT: QsInterview
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "허브 프로필 다듬기"
      WAIT: "다듬기 시작"
      SHOT: QsHub
# QsDeadline has no sheet: the pill sends the request and the Bot answers in the chat. The thread is no longer empty afterwards, so it goes last.
- runFlow:
    file: _pill.yaml
    env:
      LABEL: "마감 임박 공고 정리"
      DIR: right
- tapOn: "마감 임박 공고 정리"
- extendedWaitUntil:
    visible: ".*준비할 일이에요.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: QsDeadline

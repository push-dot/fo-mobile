appId: app.push.mobile
name: 회사 봇 · 상태 줄 (생각 중 · 작업 중 · 중지됨 · 순서 대기 · 긴 문장 · 도움 필요 · 승인 카드)
tags:
  - visual
---
# One empty 모아페이 chat per board (each later link empties it again with bot:b-moa:empty, so a board shows its own turn only). run:<token> (links.ts) makes the next message play that status board: st-think / st-work / st-queue / st-long hold
# one status line until 중지 ends it, st-help and st-approve stop at a card. The tour types the board's own user line (Android types the token).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on,bot:b-moa:empty,run:st-think"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-moa
- extendedWaitUntil:
    visible: "적합도 보기"
    timeout: 15000
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력 섹션을 고쳐 주세요"
      EN: "st-think"
- extendedWaitUntil:
    visible: ".*생각 중.*"
    timeout: 20000
- runFlow:
    file: _chat_kbd_down.yaml
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusThink
- tapOn: "중지"
- extendedWaitUntil:
    notVisible: ".*생각 중.*"
    timeout: 10000
# 작업 중, then 중지 on it (nothing was edited yet, so the stop drops the work).
- openLink: "push://bots/b-moa?mock=run:st-work,bot:b-moa:empty,stop-hold"
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력 섹션을 고쳐 주세요"
      EN: "st-work"
- extendedWaitUntil:
    visible: ".*공고 요건을 읽는 중.*"
    timeout: 20000
- runFlow:
    file: _chat_kbd_down.yaml
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusWork
- tapOn: "중지"
# stop-hold keeps the stop on 중지하는 중 (the board's one grey status line) until step-next lets it end.
- extendedWaitUntil:
    visible: ".*중지하는 중.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusStopped
- openLink: push://bots/b-moa?mock=step-next
# The stop line lands below the fold on Android; bring the thread to its end first.
- runFlow: _chat_bottom.yaml
- extendedWaitUntil:
    visible: ".*고치던 내용은 반영하지 않았어요.*"
    timeout: 10000
- openLink: "push://bots/b-moa?mock=run:st-queue,bot:b-moa:empty"
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력 섹션을 고쳐 주세요"
      EN: "st-queue"
- extendedWaitUntil:
    visible: "대기 중"
    timeout: 20000
- runFlow:
    file: _chat_kbd_down.yaml
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusQueue
- tapOn: "중지"
- extendedWaitUntil:
    notVisible: "대기 중"
    timeout: 10000
- openLink: "push://bots/b-moa?mock=run:st-long,bot:b-moa:empty"
- runFlow:
    file: _say.yaml
    env:
      KO: "누리클라우드 공고 3개 비교해서 어디에 먼저 낼지 정리해 주세요"
      EN: "st-long"
- extendedWaitUntil:
    visible: ".*공고 읽는 중.*"
    timeout: 20000
- runFlow:
    file: _chat_kbd_down.yaml
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusLong
- tapOn: "중지"
- extendedWaitUntil:
    notVisible: ".*공고 읽는 중.*"
    timeout: 10000
# 선택 카드: the run waits for an answer.
- openLink: "push://bots/b-moa?mock=run:st-help,bot:b-moa:empty"
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력 섹션을 고쳐 주세요"
      EN: "st-help"
- extendedWaitUntil:
    visible: "지원 동기 첫 문장"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusHelp
# Answering plays the generic reply and frees the composer for the approval card.
- runFlow:
    file: _pick.yaml
    env:
      PICK: ".*제품 관점.*"
      ASK: "지원 동기 첫 문장"
      NEXT: ".*메시지.*"
# The generic reply to that answer streams for a few seconds; the empty link below must come after its last line, or the line lands in the emptied thread (ChatBotStatusApprove draws the greeting and one request only).
- extendedWaitUntil:
    visible: "정리했어요. 더 필요한 게 있으면 말해 주세요."
    timeout: 30000
- waitForAnimationToEnd
- openLink: "push://bots/b-moa?mock=run:st-approve,bot:b-moa:empty"
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력 섹션을 고쳐 주세요"
      EN: "st-approve"
- extendedWaitUntil:
    visible: "채용 페이지 열기"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusApprove

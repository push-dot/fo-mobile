appId: app.push.mobile
name: 마이 캘린더 → Google 연결 안 됨·빈 날 → 일정 추가 시트
tags:
  - visual
---
# calendar() reads a failed integrations/google as not connected; set the rule before the calendar first loads.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- openLink: push://social?mock=fail:GET:integrations/google
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "캘린더"
- extendedWaitUntil:
    visible: "Google 연결 안 됨"
    timeout: 10000
# v412: the screen lists one day; its title opens the month sheet. The mock events are all in October 2026 and the sheet opens on
# the device's month, so step back from November, then pick the day (picking closes the sheet).
- tapOn: ".*달력 열기.*"
- extendedWaitUntil:
    visible: "이전 달"
    timeout: 10000
- runFlow:
    when:
      visible: "2026년 11월"
    commands:
      - tapOn: "이전 달"
- extendedWaitUntil:
    visible: ".*일정 .*개.*"
    timeout: 10000
# 10월 23일 has no event; the board selects it.
- tapOn: ".*10월 23일.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "이날은 일정이 없어요."
    timeout: 10000
- extendedWaitUntil:
    visible: "Google 연결 안 됨"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MyCalendarStates.2
      # .1 is a connected calendar on 10월 21일 (3 events and the deadline row) under the add sheet; the sheet's date is 10월 23일 (금) as the board draws it.
      # The not-connected rule above is cached by the calendar query, so the app starts again without it.
      - runFlow: ../flows/_login.yaml
      - runFlow: ../flows/_dismiss_logbox.yaml
      - tapOn: "마이"
      - extendedWaitUntil:
          visible: "김서준"
          timeout: 10000
      - tapOn: "내 활동"
      - extendedWaitUntil:
          visible: "지원한 공고"
          timeout: 10000
      - tapOn: "캘린더"
      - extendedWaitUntil:
          visible: "Google 캘린더 연결됨"
          timeout: 10000
      - tapOn: ".*달력 열기.*"
      - extendedWaitUntil:
          visible: "이전 달"
          timeout: 10000
      - runFlow:
          when:
            visible: "2026년 11월"
          commands:
            - tapOn: "이전 달"
      - tapOn: ".*10월 21일.*"
      - extendedWaitUntil:
          visible: "10월 21일 수요일.*"
          timeout: 10000
      - extendedWaitUntil:
          visible: "Google 캘린더 연결됨"
          timeout: 10000
      # The sheet opens by its route, so the day it carries (10월 23일) is not the day behind it, as in the board.
      - openLink: push://activity/add-event?day=2026-10-23
      - extendedWaitUntil:
          visible: "어떤 일정을 추가할까요?"
          timeout: 10000
      # The board's 일정 추가하기 is enabled, and the app enables it only with a title; the date and time pickers are native (the owner's rule).
      - tapOn: "일정 이름"
      - inputText: "카카오 1차 면접"
      - runFlow: _hide_kbd.yaml
      - waitForAnimationToEnd
      - takeScreenshot: MyCalendarStates.1

- openLink: push://social?mock=reset

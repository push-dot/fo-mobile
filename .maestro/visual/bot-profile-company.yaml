appId: app.push.mobile
name: Bot 프로필 · 회사 Bot
tags:
  - visual
---
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=reset,grants:none"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-moa/profile
- extendedWaitUntil:
    visible: "백엔드 엔지니어"
    timeout: 10000
# BotProfile and BotProfileColor draw 모아페이 without the 허용한 사이트 row, so the grants come only before BotProfileAllowed.
- waitForAnimationToEnd
- takeScreenshot: BotProfile
- tapOn: "Bot 색 바꾸기"
- extendedWaitUntil:
    visible: "Bot 색"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: BotProfileColor
- tapOn: "완료"
- extendedWaitUntil:
    visible: "백엔드 엔지니어"
    timeout: 5000
- openLink: "push://bots/b-moa/profile?mock=grants:seed"
- extendedWaitUntil:
    visible: "허용한 사이트.*"
    timeout: 10000
- tapOn: "허용한 사이트.*"
- extendedWaitUntil:
    visible: "careers.moapay.co.kr 허용 해제"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: BotProfileAllowed
- tapOn: "careers.moapay.co.kr 허용 해제"
- extendedWaitUntil:
    visible: "careers.moapay.co.kr 허용을 해제했어요"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: BotProfileAllowedRevoke
# BotProfileDelete draws the profile without the 허용한 사이트 row: revoking the last site closes the sheet and drops the row.
- tapOn: "moapay.notion.site 허용 해제"
- extendedWaitUntil:
    notVisible: "허용한 사이트.*"
    timeout: 5000
# The 허용 해제 toasts are still up (they have no place on the delete board); wait them out before the alert.
- extendedWaitUntil:
    notVisible: "moapay.notion.site 허용을 해제했어요"
    timeout: 10000
- tapOn: "Bot 삭제"
- extendedWaitUntil:
    visible: "모아페이 Bot을 삭제할까요?"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: BotProfileDelete
- tapOn: "취소"

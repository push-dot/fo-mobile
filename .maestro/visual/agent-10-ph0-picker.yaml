appId: app.push.mobile
name: 봇 · Phase 0-I 자료 고르기 시트
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# ChatPh0Picker draws an account with two documents and one bookmark.
- openLink: push://bots/b-moa?mock=picker-few
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 만들어 주세요"
      EN: "make resume"
- extendedWaitUntil:
    visible: "어떤 방식으로 진행할까요?"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: ".*이력서부터 쓸게요"
- extendedWaitUntil:
    visible: "어떤 산출물을 만들까요?"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "다음"
- extendedWaitUntil:
    visible: "가져올 자료"
    timeout: 15000
- waitForAnimationToEnd
# A row that can change opens a modal per kind of material: the kinds first, then the list of that kind (3 most recent rows).
- tapOn: "백엔드 엔지니어.*"
- extendedWaitUntil:
    visible: "어떤 자료로 바꿀까요?"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "내 서류에서"
- extendedWaitUntil:
    visible: "내 서류"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatPh0Picker

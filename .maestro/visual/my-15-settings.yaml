appId: app.push.mobile
name: 마이 설정 → 언어 → 커리어 상태 공개 범위
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "설정"
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: Settings

# v412: the language row shows only the value; the choice is a wheel in a modal (iOS) or a radio dialog (Android) with 취소 first.
- tapOn: "언어.*"
- extendedWaitUntil:
    visible: "취소"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: SettingsLanguage
- tapOn: "취소"
- waitForAnimationToEnd

# 혜택·이벤트 알림 stays in the list (the consent row is legally required) and pushes 커리어 상태 below the fold.
- scrollUntilVisible:
    element: "커리어 상태.*"
    direction: DOWN
    centerElement: true
- tapOn: "커리어 상태.*"
# The 커리어 상태 picker carries the 숨기기 switch.
- extendedWaitUntil:
    visible: ".*사람에게 숨기기.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SettingsVisibility

appId: app.push.mobile
tags:
  - subflow
# Taps ${PICK} in the regular modal that asks ${ASK} until ${NEXT} shows. A tap while the modal is still sliding up is dropped, and an earlier
# pick leaves the same text as a user bubble, so the tap is scoped below the question.
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: ${ASK}
          commands:
            - tapOn:
                text: ${PICK}
                below: ${ASK}
      - extendedWaitUntil:
          visible: ${NEXT}
          timeout: 8000

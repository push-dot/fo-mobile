appId: app.push.mobile
name: 마이 설정 → 로그아웃·탈퇴 확인 (취소)
tags:
  - visual
---
# The boards have 참고 데이터 제공 on; the mock starts it off (so the chat asks first), so the link switches it on before the settings load.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on"
      READY: "새로 올라온 공고"
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
# v415 board: 1 = iOS 로그아웃 alert, 2 = Android 로그아웃, 3 = iOS 회원 탈퇴 alert, 4 = Android 회원 탈퇴. The contact and tone
# sheets are not panels of this board (an earlier tour shot them as .3/.4, which put a sheet where the 탈퇴 alert belongs).
# Neither alert is confirmed: logging out or deleting would end the session.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "설정"
      - extendedWaitUntil:
          visible: ".*Google 계정으로 로그인.*"
          timeout: 10000
      # The boards' list starts at 허브 공개 (3 rows, no 차단한 사람 row) and ends at 4 기타 rows; the app has two more rows (차단한
      # 사람, 구매 복원), so 허브 공개 and 회원 탈퇴 cannot both be on screen. The list is scrolled to its end (the rows to tap),
      # backed off ~30pt.
      - runFlow: _settings_end.yaml
      - tapOn: "로그아웃"
      # Retap if the alert did not open (dropped first tap, see flows/05_my_settings_logout.yaml).
      - runFlow:
          when:
            notVisible: "취소"
          commands:
            - tapOn: "로그아웃"
      - extendedWaitUntil:
          visible: "로그아웃할까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.1
      - tapOn: "취소"
      - waitForAnimationToEnd
      - tapOn: "회원 탈퇴"
      - extendedWaitUntil:
          visible: "회원 탈퇴할까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.3
      - tapOn: "취소"

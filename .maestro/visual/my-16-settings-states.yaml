appId: app.push.mobile
name: 마이 설정 → 로그아웃·탈퇴 확인 (취소)
tags:
  - visual
---
# The boards have 참고 데이터 제공 on; the mock starts it off (so the chat asks first), so the link switches it on before the settings load.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on"
      READY: "새로 올라온 공고"
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
# v427 board: .1 = the 로그아웃 alert, .2 = the 회원 탈퇴 alert, .3 = the 연락처 sheet, .4 = the 말투 sheet. Neither alert is confirmed:
# logging out or deleting would end the session.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "설정"
      - extendedWaitUntil:
          visible: ".*Google 계정으로 로그인.*"
          timeout: 10000
      # The sheets' backdrop is the list from its top (허브 공개 under the title), which is where it opens and returns to after a sheet closes.
      - tapOn: "연락처는.*"
      - extendedWaitUntil:
          visible: "누구에게 연락처를 보여 줄까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.3
      # These sheets have no 닫기 button of their own (iOS only labels the scrim 팝업 닫기).
      - runFlow:
          file: _close_sheet.yaml
          env:
            TITLE: "누구에게 연락처를 보여 줄까요?"
      - extendedWaitUntil:
          notVisible: "누구에게 연락처를 보여 줄까요?"
          timeout: 5000
      - tapOn: "말투.*"
      - extendedWaitUntil:
          visible: "Bot이 어떤 말투로 쓸까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.4
      - runFlow:
          file: _close_sheet.yaml
          env:
            TITLE: "Bot이 어떤 말투로 쓸까요?"
      - extendedWaitUntil:
          notVisible: "Bot이 어떤 말투로 쓸까요?"
          timeout: 5000
      # The boards' alert backdrop is the list's end (G57: the app has two more rows, so 허브 공개 and 회원 탈퇴 cannot both be on screen); scrolled to its end, backed off ~30pt.
      - runFlow: _settings_end.yaml
      - tapOn: "로그아웃"
      # Retap if the alert did not open (dropped first tap, see flows/05_my_settings_logout.yaml).
      - runFlow:
          when:
            notVisible: "취소"
          commands:
            - tapOn: "로그아웃"
      - extendedWaitUntil:
          visible: "로그아웃할까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.1
      - tapOn: "취소"
      - waitForAnimationToEnd
      - tapOn: "회원 탈퇴"
      - extendedWaitUntil:
          visible: "회원 탈퇴할까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.2
      - tapOn: "취소"

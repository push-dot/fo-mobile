appId: app.push.mobile
name: 로그인 → 휴대폰 번호 → 인증번호 → Google 로그인 후 휴대폰 번호
tags:
  - visual
---
# Signed out, so this tour starts from a cleared launch instead of the dev-token login.
- clearKeychain
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Google로 시작하기"
    timeout: 60000
# The cleared launch shows the LogBox toast over 휴대폰 번호로 시작하기; a tap there opens the debugger.
- runFlow: ../flows/_dismiss_logbox.yaml
- waitForAnimationToEnd
- takeScreenshot: SignIn
# The cleared launch shows the LogBox toast over 휴대폰 번호로 시작하기, sometimes only after the first check;
# a tap on the toast opens the debugger, so close it and tap again until the form shows.
- retry:
    maxRetries: 3
    commands:
      - runFlow: ../flows/_dismiss_logbox.yaml
      - tapOn: "휴대폰 번호로 시작하기"
      - extendedWaitUntil:
          visible: "인증번호 받기"
          timeout: 6000
- tapOn: "휴대폰 번호"
- inputText: "01012345678"
# The board draws the field filled with the pad already down and 인증번호 받기 in view.
- runFlow: _hide_kbd.yaml
- waitForAnimationToEnd
- takeScreenshot: PhoneInputDirect
- tapOn: "인증번호 받기"
- extendedWaitUntil:
    visible: "인증번호를 입력해 주세요"
    timeout: 10000
- inputText: "482"
- runFlow: _hide_kbd.yaml
- waitForAnimationToEnd
- takeScreenshot: PhoneCode
# PhoneInput: the phone screen as it opens after a Google sign-in (the native sign-in cannot run here). The mock link
# seeds the pending sign-in, then the route opens with its account pill, the field filled and the pad down like PhoneInputDirect.
- openLink: "push://sign-in?mock=phone-social"
- openLink: "push://phone"
- extendedWaitUntil:
    visible: "seojun.kim@gmail.com"
    timeout: 10000
- tapOn: "휴대폰 번호"
- inputText: "01012345678"
- runFlow: _hide_kbd.yaml
- waitForAnimationToEnd
- takeScreenshot: PhoneInput

appId: app.push.mobile
name: probe offer accept tap loop
tags:
  - visual
---
- evalScript: ${output.n = 0}
- repeat:
    times: 16
    commands:
      - evalScript: ${output.n = output.n + 1}
      - runFlow:
          file: _login_mock.yaml
          env:
            MOCK: "push://sign-in?mock=blocked-by-them"
            READY: "새로 올라온 공고"
      - tapOn: "마이"
      - extendedWaitUntil:
          visible: "김서준"
          timeout: 10000
      - tapOn: "받은 제안 .*개"
      - extendedWaitUntil:
          visible: ".*오지현.*"
          timeout: 10000
      - tapOn: ".*오지현.*"
      - extendedWaitUntil:
          visible: "수락하고 답장하기"
          timeout: 10000
      - tapOn: "수락하고 답장하기"
      - extendedWaitUntil:
          visible: "어떻게 답장할까요?"
          timeout: 10000
      - tapOn: "답장.*"
      - inputText: "제안 감사해요, 지현 님! 다음 주 화요일이나 목요일 저녁이면 좋아요."
      - tapOn: "수락하고 보내기"
      - extendedWaitUntil:
          visible: ".*목요일 저녁 7시.*"
          timeout: 6000
          optional: true
      - runFlow:
          when:
            visible: "DBG.*"
          commands:
            - copyTextFrom:
                text: "DBG.*"
            - evalScript: ${console.log('PROBEFAIL ' + output.n + ' ' + maestro.copiedText)}
            - takeScreenshot: probe-fail-${output.n}
      - evalScript: ${console.log('PROBEITER ' + output.n)}

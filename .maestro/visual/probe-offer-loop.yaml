appId: app.push.mobile
name: probe offer accept tap loop
tags:
  - visual
---
- repeat:
    times: 12
    commands:
      - runFlow:
          file: _login_mock.yaml
          env:
            MOCK: "push://sign-in?mock=blocked-by-them"
            READY: "새로 올라온 공고"
      - tapOn: "마이"
      - extendedWaitUntil:
          visible: "김서준"
          timeout: 10000
      - tapOn: "받은 제안 .*개"
      - extendedWaitUntil:
          visible: ".*오지현.*"
          timeout: 10000
      - tapOn: ".*오지현.*"
      - extendedWaitUntil:
          visible: "수락하고 답장하기"
          timeout: 10000
      - tapOn: "수락하고 답장하기"
      - extendedWaitUntil:
          visible: "어떻게 답장할까요?"
          timeout: 10000
      - tapOn: "답장.*"
      - inputText: "제안 감사해요, 지현 님! 다음 주 화요일이나 목요일 저녁이면 좋아요."
      - tapOn: "수락하고 보내기"
      - extendedWaitUntil:
          visible: ".*목요일 저녁 7시.*"
          timeout: 6000
          optional: true
      - copyTextFrom:
          text: "DBG.*"
          optional: true
      - evalScript: ${console.log('PROBE copied=' + maestro.copiedText)}
      - takeScreenshot: probe-iter

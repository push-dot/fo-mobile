appId: app.push.mobile
name: PlanUpgradeClosed · PlanUltraClosed
tags:
  - visual
---
# payments-closed makes GET chat/account answer paymentsEnabled: false, so the plan page draws no buy button (ULTRA로 업그레이드, 크레딧 구매).
# PRO account first, then a second login as ULTRA; the plan page opens from the bot home account button.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=payments-closed,consent-on"
      READY: "새로 올라온 공고"
- runFlow:
    file: ../flows/_tap_tab.yaml
    env:
      TAB: "봇"
      READY: "(동의하고 시작하기|새 회사 봇 만들기|Push Bot)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
      - extendedWaitUntil:
          notVisible: "동의하고 시작하기"
          timeout: 10000
- tapOn: "계정 · .*"
- extendedWaitUntil:
    visible: "Bot이 참고하는 내 정보"
    timeout: 10000
- tapOn: "PRO"
- extendedWaitUntil:
    visible: "플랜마다.*"
    timeout: 5000
- assertNotVisible: "ULTRA로 업그레이드"
- assertNotVisible: "크레딧 구매"
- waitForAnimationToEnd
- takeScreenshot: PlanUpgradeClosed
- openLink: push://?mock=reset
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=payments-closed,plan-ultra,consent-on"
      READY: "새로 올라온 공고"
- runFlow:
    file: ../flows/_tap_tab.yaml
    env:
      TAB: "봇"
      READY: "(동의하고 시작하기|새 회사 봇 만들기|Push Bot)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
      - extendedWaitUntil:
          notVisible: "동의하고 시작하기"
          timeout: 10000
- tapOn: "계정 · .*"
- extendedWaitUntil:
    visible: "Bot이 참고하는 내 정보"
    timeout: 10000
- tapOn: "ULTRA"
- extendedWaitUntil:
    visible: "플랜마다.*"
    timeout: 5000
- extendedWaitUntil:
    visible: "지금 ULTRA를 쓰고 있어요"
    timeout: 5000
- assertNotVisible: "크레딧 구매"
- waitForAnimationToEnd
- takeScreenshot: PlanUltraClosed
- openLink: push://?mock=reset

appId: app.push.mobile
name: 마이 서류 → 올린 파일 보기 → 프로필로 전환 → 기본 프로필 설정
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서_2026"
    timeout: 10000
- tapOn: "김서준_백엔드_이력서_2026"
- extendedWaitUntil:
    visible: "지원용 프로필로 전환"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocViewer

- tapOn: "지원용 프로필로 전환"
- extendedWaitUntil:
    visible: "지원용 프로필로 만들까요?"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocToProfile

# 만들기 converts the file into a 지원용 프로필 (Push 서류) and opens it; the 내 프로필(기본) stays as it was until 기본 프로필로 설정.
- tapOn: "만들기"
- extendedWaitUntil:
    visible: "기본 프로필로 설정"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: DocProfile

- tapOn: "기본 프로필로 설정"
- extendedWaitUntil:
    visible: "허브에 보이는 내 프로필\\(기본\\)이 이 지원용 프로필의 내용으로 바뀌어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocProfileConfirm

- tapOn: "적용"
- extendedWaitUntil:
    notVisible: "기본 프로필로 설정"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocProfileDone

appId: app.push.mobile
name: 공고 상세 → ULTRA 계정의 적합도 카드
tags:
  - visual
---
# plan-ultra makes the account ULTRA and tells the fo-web WebView mock, which then adds the `이렇게 고치면 8점대` row under the card.
# JobDetail.7 (iOS light), .8 (iOS dark) and .9 (Android) are taken once the card's bars settle.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=plan-ultra"
      READY: "새로 올라온 공고"
- runFlow: _open_jobs.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- tapOn:
    text: ".*모아페이.*"
    index: 0
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*이렇게 고치면 8점대.*"
    timeout: 30000
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: JobDetail.7
      - takeScreenshot: JobDetail.8
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: JobDetail.9
- openLink: push://?mock=reset

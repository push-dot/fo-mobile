appId: app.push.mobile
name: 공고 상세 → ULTRA 계정의 적합도 카드
tags:
  - visual
---
# plan-ultra makes the account ULTRA. The detail body is the fo-web WebView, whose mock serves one finished fit card for every plan,
# so JobDetail.7 (iOS light) and .8 (iOS dark) are taken from that card once its bars settle.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=plan-ultra"
      READY: "새로 올라온 공고"
- runFlow: _open_jobs.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- tapOn:
    text: ".*모아페이.*"
    index: 0
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*조금만 고치면 8점대예요.*"
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: JobDetail.7
      - takeScreenshot: JobDetail.8
- openLink: push://?mock=reset

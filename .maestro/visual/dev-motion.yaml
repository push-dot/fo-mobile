appId: app.push.mobile
name: 모션 확인 페이지 → Reduce Motion 끔 / 켬 각각 끝 위치
tags:
  - visual
---
# Dev-only diagnostic (mock build): every entry motion beside the rect it must end on, once with Reduce Motion off and once on.
# The device setting is flipped through the run's own listener (coverage/motion-check/motion-run.sh) and the app relaunches, so
# the app reads the new value at launch like a real user who changed it in Settings.
# The simulator can take a moment to hand a new setting to a fresh app process, so the whole open is retried until the page reads RM off.
- retry:
    maxRetries: 3
    commands:
      - evalScript: ${http.get('http://127.0.0.1:8123/rm/NO')}
      - runFlow: ../flows/_login.yaml
      - openLink: push://dev/motion
      - extendedWaitUntil:
          visible: "RM off"
          timeout: 20000
- extendedWaitUntil:
    visible: "done 1"
    timeout: 30000
- takeScreenshot: Motion.1
# Replay: the first shot is taken right after the tap (the 3 s rows are still moving), the second once the page says done.
- tapOn:
    id: motion-replay
- takeScreenshot: Motion.2
- extendedWaitUntil:
    visible: "done 2"
    timeout: 30000
- takeScreenshot: Motion.3
- tapOn:
    id: motion-toast
- extendedWaitUntil:
    visible: "모션 확인 토스트예요"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 700
- takeScreenshot: Motion.4
- tapOn:
    id: motion-panel
# The open panel is an accessibility modal and its rows are not found by text, so wait for the screen to stop changing (the panel lands within 720 ms).
- repeat:
    times: 4
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: Motion.5

# The simulator can take a moment to hand a new setting to a fresh app process, so the whole open is retried until the page reads RM on.
- retry:
    maxRetries: 3
    commands:
      - evalScript: ${http.get('http://127.0.0.1:8123/rm/YES')}
      - runFlow: ../flows/_login.yaml
      - openLink: push://dev/motion
      - extendedWaitUntil:
          visible: "RM on"
          timeout: 20000
- extendedWaitUntil:
    visible: "done 1"
    timeout: 30000
- takeScreenshot: Motion.6
# Replay: the first shot is taken right after the tap (the 3 s rows are still moving), the second once the page says done.
- tapOn:
    id: motion-replay
- takeScreenshot: Motion.7
- extendedWaitUntil:
    visible: "done 2"
    timeout: 30000
- takeScreenshot: Motion.8
- tapOn:
    id: motion-toast
- extendedWaitUntil:
    visible: "모션 확인 토스트예요"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 700
- takeScreenshot: Motion.9
- tapOn:
    id: motion-panel
# The open panel is an accessibility modal and its rows are not found by text, so wait for the screen to stop changing (the panel lands within 720 ms).
- repeat:
    times: 4
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: Motion.10

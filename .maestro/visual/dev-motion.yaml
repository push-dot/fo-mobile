appId: app.push.mobile
name: 모션 확인 페이지 → Reduce Motion 끔 / 켬 각각 끝 위치
tags:
  - visual
---
# Dev-only diagnostic (mock build): every entry motion beside the rect it must end on, once with Reduce Motion off and once on.
# The device setting is flipped through the run's own listener (coverage/motion-check/motion-run.sh) and the app relaunches, so
# the app reads the new value at launch like a real user who changed it in Settings.
- evalScript: ${http.get('http://127.0.0.1:8123/rm/NO')}
- runFlow: ../flows/_login.yaml
- openLink: push://dev/motion
- extendedWaitUntil:
    visible: "RM off"
    timeout: 20000
- extendedWaitUntil:
    visible: "done 1"
    timeout: 20000
- takeScreenshot: Motion.1
- tapOn:
    id: motion-replay
- extendedWaitUntil:
    visible: "done 2"
    timeout: 20000
- takeScreenshot: Motion.2
- tapOn:
    id: motion-toast
- extendedWaitUntil:
    visible: "모션 확인 토스트예요"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 700
- takeScreenshot: Motion.3
- tapOn:
    id: motion-panel
- extendedWaitUntil:
    visible: "done 3"
    timeout: 20000
- takeScreenshot: Motion.4

- evalScript: ${http.get('http://127.0.0.1:8123/rm/YES')}
- runFlow: ../flows/_login.yaml
- openLink: push://dev/motion
- extendedWaitUntil:
    visible: "RM on"
    timeout: 20000
- extendedWaitUntil:
    visible: "done 1"
    timeout: 20000
- takeScreenshot: Motion.5
- tapOn:
    id: motion-replay
- extendedWaitUntil:
    visible: "done 2"
    timeout: 20000
- takeScreenshot: Motion.6
- tapOn:
    id: motion-toast
- extendedWaitUntil:
    visible: "모션 확인 토스트예요"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 700
- takeScreenshot: Motion.7
- tapOn:
    id: motion-panel
- extendedWaitUntil:
    visible: "done 3"
    timeout: 20000
- takeScreenshot: Motion.8

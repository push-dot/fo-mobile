appId: app.push.mobile
name: 봇 · 빠른 시작 시트 (부족한 점 찾기, QsGap)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    file: _pill.yaml
    env:
      LABEL: "부족한 점 찾기"
      DIR: left
- tapOn: "부족한 점 찾기"
- extendedWaitUntil:
    visible: "공고 요건과 내 서류를 비교해요."
    timeout: 15000
# The bookmark rows load after the sheet opens: the board draws them.
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: QsGap

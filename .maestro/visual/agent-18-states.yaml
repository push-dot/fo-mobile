appId: app.push.mobile
name: 봇 · 진행 상태 (자동 선택 · 답 기다림, iOS 전용 패널)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: _company_tab.yaml
      - runFlow:
          file: _say.yaml
          env:
            KO: "모아페이 공고에 맞춰 이력서 PDF로 만들어 줘"
            EN: "auto-pick"
      - extendedWaitUntil:
          visible: ".*자동으로 골랐어요: 경력 섹션부터 고치기.*"
          timeout: 30000
      # The boards have no keyboard: a tap on the user's own bubble lowers it (a tap on a bot line opens the Bot's profile).
      - runFlow:
          file: _chat_kbd_down.yaml
          env:
            TEXT: ".*PDF로 만들어 줘.*"
      - takeScreenshot: ChatStates.1
      - runFlow: _fresh_company.yaml
      - runFlow:
          file: _say.yaml
          env:
            KO: "경력 섹션을 공고에 맞게 고쳐 줘"
            EN: "await"
      - extendedWaitUntil:
          visible: "확인을 기다리고 있어요"
          timeout: 30000
      - runFlow:
          file: _chat_kbd_down.yaml
          env:
            TEXT: ".*경력 섹션을 공고에 맞게 고쳐 줘.*"
      - takeScreenshot: ChatStates.2

appId: app.push.mobile
name: 봇 · 적합도 카드 (결제 닫힘)
tags:
  - visual
---
# payments-closed hides every buy button, so the FREE fit card draws without its plan button.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=payments-closed,consent-on"
      READY: "새로 올라온 공고"
# _agent_tab.yaml enters the 봇 tab itself.
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ph1-free"
      BOT: "push"
      KO: "이 공고에 내 이력서가 얼마나 맞는지 봐 줘"
      EN: "ph1-free"
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitClosed
- openLink: push://?mock=reset

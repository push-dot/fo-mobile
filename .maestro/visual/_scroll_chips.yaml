appId: app.push.mobile
tags:
  - subflow
# The 채용공고 filter chip row scrolls sideways: 지역 is clipped and 고용형태 is off screen until it is swiped left.
# The row sits at 14% of the height on Android and at 16% on iOS (y139 of 874, as the board draws it).
---
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "90%,16%"
          end: "10%,16%"
          duration: 300
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "90%,14%"
          end: "10%,14%"
          duration: 300
- waitForAnimationToEnd

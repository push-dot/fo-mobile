appId: app.push.mobile
name: 약관 동의 → 개인정보 처리방침 보기
tags:
  - visual
---
# The privacy policy opened from the 약관 동의 screen is the TermsViewPrivacy board (v408).
- runFlow: _phone_code.yaml
- inputText: "482915"
- runFlow: _hide_kbd.yaml
- tapOn: "확인"
- extendedWaitUntil:
    visible: "서비스 이용에 동의해 주세요"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: TermsPrivacyLink
- tapOn: "개인정보 처리방침 보기"
- extendedWaitUntil:
    visible: "1. 수집하는 개인정보"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: TermsViewPrivacy
- assertNotVisible: "동의하기"

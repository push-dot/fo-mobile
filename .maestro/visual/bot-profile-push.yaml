appId: app.push.mobile
name: Bot 프로필 · Push Bot
tags:
  - visual
---
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=reset"
      READY: "새로 올라온 공고"
- openLink: push://bots/push/profile
- extendedWaitUntil:
    visible: "Push Bot"
    timeout: 10000
- extendedWaitUntil:
    visible: "허용한 사이트.*"
    timeout: 10000
# The 회사 row needs the bot list, which loads after the profile.
- extendedWaitUntil:
    visible: "회사.*"
    timeout: 10000
- assertNotVisible: "Bot 삭제"
- assertNotVisible: "Bot 색 바꾸기"
- waitForAnimationToEnd
- takeScreenshot: BotProfilePush
- tapOn: "회사.*"
- extendedWaitUntil:
    visible: "회사 .*개"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: BotProfileChief
- tapOn:
    point: "8%,10%"
- extendedWaitUntil:
    visible: "허용한 사이트.*"
    timeout: 5000
- tapOn: "허용한 사이트.*"
- extendedWaitUntil:
    visible: "Bot이 묻지 않고 읽는 사이트예요.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: BotProfileChiefAllowed
# The sheet has no close button; a tap on the dimmed area above it closes it.
- tapOn:
    point: "50%,10%"

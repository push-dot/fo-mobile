appId: app.push.mobile
name: 마이 서류 보기 ⋯ 메뉴 → 이름 바꾸기 → 삭제 실패, 내 활동 전체 글 ⋯ 메뉴
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: ".*다온뱅크.*"
    timeout: 10000
- tapOn: ".*다온뱅크.*"
- extendedWaitUntil:
    visible: "Bot한테 보내기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "PDF로 내보내기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocViewMenuNoDuplicate
# PushDocViewMenu draws 복제하기, which the app has no call for: the same menu is shot under its name so the capture is judged against it.
- takeScreenshot: PushDocViewMenu
- tapOn: "이름 바꾸기"
- extendedWaitUntil:
    visible: "서류 이름 바꾸기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocRename
# iOS asks for the name in a system alert (Alert.prompt: native wins); a tap outside or a swipe cannot close it, 취소 does. Android keeps its sheet.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "취소"
- runFlow:
    when:
      platform: Android
    file: _close_sheet.yaml
    env:
      TITLE: "서류 이름 바꾸기"
- extendedWaitUntil:
    notVisible: "서류 이름 바꾸기"
    timeout: 10000
- tapOn: "뒤로"
- waitForAnimationToEnd

- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "게시글"
- extendedWaitUntil:
    visible: "내가 쓴 글"
    timeout: 10000
- tapOn: ".*전체 보기.*"
- extendedWaitUntil:
    visible: "8개"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "댓글 단 글"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyPostsAllMenu
# MyPostsAllMenuFull draws 저장한 글 and 정렬, which the server lacks (G32): the app's menu is shot under its name so it is judged against it.
- takeScreenshot: MyPostsAllMenuFull

# The archive and file delete routes fail from the start: the Push document keeps its failure toast, and an uploaded file comes back to the list with the toast DeleteDocFail draws.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=fail:POST:documents/.*/archive,fail:DELETE:sources/.*"
      READY: "새로 올라온 공고"
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: ".*다온뱅크.*"
    timeout: 10000
- tapOn: ".*다온뱅크.*"
- extendedWaitUntil:
    visible: "Bot한테 보내기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "삭제하기"
    timeout: 10000
- tapOn: "삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "삭제"
- runFlow:
    when:
      platform: Android
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    visible: "서류를 삭제하지 못했어요"
    timeout: 10000
- tapOn: "뒤로"
# The first 뒤로 can land on the failure toast and leave the document open: tap it again when 올린 파일 is not there.
- runFlow:
    when:
      notVisible: "올린 파일"
    commands:
      - tapOn: "뒤로"
# The failure toast leaves the document open under a 뒤로 tap by label: tap the back arrow by position (top left) when 올린 파일 is still not there.
- runFlow:
    when:
      notVisible: "올린 파일"
    commands:
      - tapOn:
          point: "8%,9%"
- extendedWaitUntil:
    visible: "올린 파일"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "90%,56%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "90%,52%"
- extendedWaitUntil:
    visible: "서류 삭제하기"
    timeout: 5000
- tapOn: "서류 삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "삭제"
- runFlow:
    when:
      platform: Android
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    visible: "서류를 삭제했어요"
    timeout: 10000
- extendedWaitUntil:
    visible: "서류를 삭제하지 못했어요"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: DeleteDocFail

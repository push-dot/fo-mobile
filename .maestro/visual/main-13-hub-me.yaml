appId: app.push.mobile
name: 허브 → 내 프로필
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "허브"
- extendedWaitUntil:
    visible: "추천 프로필"
    timeout: 10000
- tapOn: "내 프로필"
- extendedWaitUntil:
    visible: ".*기본 정보 편집.*"
    timeout: 30000
    optional: true
- waitForAnimationToEnd
# 내보내기 downloads the profile PDF (GET me/profile/pdf), so the screen is ProfileDetailMePdf; ProfileDetailMe is the same screen without that button.
- extendedWaitUntil:
    visible: "내보내기"
    timeout: 10000
- takeScreenshot: ProfileDetailMePdf

appId: app.push.mobile
name: 봇 · 변경 확인 → 적용 → 프로필 저장 확인 → 완료 → 바로 지원
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor resume"
- extendedWaitUntil:
    visible: "이 수정을 적용할까요?"
    timeout: 60000
# The approval panel slides up; a tap during the slide can land on 그대로 두기.
- waitForAnimationToEnd
- takeScreenshot: ChatApprove
- tapOn: ".*적용"
- extendedWaitUntil:
    visible: "Push 프로필에 저장했어요. 결과를 확인할까요?"
    timeout: 60000
# ChatDoneNext draws the finished resume run (할 일 5/5, closing line, the 김서준_모아페이_백엔드.pdf card) with the three-button sheet
# (바로 지원하기 · 프로필로 전환 · 취소), not the profile run, so it takes its own run (mock token ext-done).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-done"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
# The closing summary streams in below the fold and can stop the follow-the-end scroll (새 내용 pill).
- retry:
    maxRetries: 3
    commands:
      - runFlow: _chat_bottom.yaml
      - extendedWaitUntil:
          visible: "모아페이에 바로 지원하기"
          timeout: 8000
- waitForAnimationToEnd
# The run's end asks in an action sheet (ChatDoneNext); the chat itself holds no buttons.
- takeScreenshot: ChatDoneNext
- tapOn: "모아페이에 바로 지원하기"
- extendedWaitUntil:
    visible: "이 공고에 지원해요"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh6Apply
# ChatDoneProfile: the finished card with the sheet closed.
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "profile-done"
      BOT: "b-moa"
      KO: "프로필 더 좋게 고쳐 줘"
      EN: "Make my profile better"
- extendedWaitUntil:
    visible: "다음으로 무엇을 할까요?"
    timeout: 20000
- runFlow: _dismiss_next.yaml
- takeScreenshot: ChatDoneProfile
# ChatPh6Result draws only the closing line and the card under the open gate, so it jumps there in a fresh conversation (mock token).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "profile-gate"
      BOT: "b-moa"
      KO: "프로필 더 좋게 고쳐 줘"
      EN: "Make my profile better"
- extendedWaitUntil:
    visible: "Push 프로필에 저장했어요. 결과를 확인할까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh6Result

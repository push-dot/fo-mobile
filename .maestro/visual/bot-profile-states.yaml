appId: app.push.mobile
name: 봇 프로필 · 긴 이름 · 음소거 · 로딩 · 오류
tags:
  - visual
---
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=bots:long"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-nuri/profile
- extendedWaitUntil:
    visible: "누리클라우드 플랫폼엔지니어링코리아 판교캠퍼스 유한회사"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: BotProfileLong
- openLink: "push://bots/b-moa/profile?mock=reset,bot:b-moa:muted"
- extendedWaitUntil:
    visible: "백엔드 엔지니어"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: BotProfileMuted
- openLink: "push://bots/b-moa/profile?mock=reset,hang:GET:bots/b-moa"
- extendedWaitUntil:
    visible: "봇 프로필을 불러오는 중이에요"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: BotProfileLoading
- openLink: "push://bots/b-moa/profile?mock=reset,fail:GET:bots/b-moa"
- extendedWaitUntil:
    visible: "봇 정보를 불러오지 못했어요"
    timeout: 10000
- extendedWaitUntil:
    visible: "모아페이"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: BotProfileError

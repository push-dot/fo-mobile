appId: app.push.mobile
name: BotNewSearchStart
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- openLink: push://bots/new
- extendedWaitUntil:
    visible: "이름"
    timeout: 20000
- tapOn: "회사, 공고, 링크로 찾아보세요"
# 검색 닫기 only shows in the search state, so it proves the field took focus.
- extendedWaitUntil:
    visible: "검색 닫기"
    timeout: 10000
# The simulator shows no software keyboard for a field that only took focus; typing one character brings it up, and erasing it
# leaves the empty field the board draws above the keyboard.
- inputText: "a"
- eraseText: 1
- waitForAnimationToEnd
- takeScreenshot: BotNewSearchStart

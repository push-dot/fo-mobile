appId: app.push.mobile
name: 봇 · 참고 데이터 동의 시트 (Push Bot · 회사 봇)
tags:
  - visual
---
# The mock starts with 참고 데이터 제공 off and a chat asks for it when it opens. Declining marks the prompt dismissed, so each board
# starts from a fresh launch.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=bots:none"
      READY: "새로 올라온 공고"
- openLink: push://bots/push
- extendedWaitUntil:
    visible: "동의하고 시작하기"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ChatConsent
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=bot:b-moa:empty"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-moa
- extendedWaitUntil:
    visible: "동의하고 시작하기"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ChatConsentCompany

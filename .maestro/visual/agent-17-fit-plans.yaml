appId: app.push.mobile
name: 봇 · 적합도 카드 (FREE · ULTRA · 펼침)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ph1-free"
      BOT: "b-moa"
      KO: "이 공고에 내 이력서가 얼마나 맞는지 봐 줘"
      EN: "How well does my resume fit this job"
# The open gate is a modal panel that hides the chat text from accessibility, so wait on its question; the card is on screen above it.
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitFree
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ph1-ultra"
      BOT: "b-moa"
      KO: "이 공고에 내 이력서가 얼마나 맞는지 봐 줘"
      EN: "How well does my resume fit this job"
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitUltra
# The card cannot be tapped once the gate is up, so a second run holds the gate back (mock token) until the card is open.
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ph1-ultra-open"
      BOT: "b-moa"
      KO: "이 공고에 내 이력서가 얼마나 맞는지 봐 줘"
      EN: "How well does my resume fit this job"
- extendedWaitUntil:
    visible: "이렇게 고치면 8점대"
    timeout: 20000
- tapOn: "이렇게 고치면 8점대"
- extendedWaitUntil:
    visible: ".*정산 도메인 경험을 한 줄 추가하기.*"
    timeout: 5000
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitUltraOpen

appId: app.push.mobile
name: 봇 · 작업 중 중지 → 다시 요청
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# run:tailor hold holds the working line on iOS too (the typed line is the board's own); run: with no token ends it again below.
- openLink: push://bots/b-moa?mock=run:tailor%20hold
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor hold"
- extendedWaitUntil:
    visible: ".*기술 스택을 비교하는 중.*"
    timeout: 40000
- tapOn: "중지"
# The stop line lands below the fold on Android; bring the thread to its end first.
- runFlow: _chat_bottom.yaml
- extendedWaitUntil:
    visible: ".*작업을 중지했어요.*"
    timeout: 5000
# The board's thread starts at the stop line: the first request and its card are older turns.
- openLink: "push://bots/b-moa?mock=run:,bot:b-moa:from:notice"
- runFlow:
    file: _say.yaml
    env:
      KO: "잠깐, 자기소개서도 같이 써 줘"
      EN: "wait also write cover letter"
# The keyboard goes down first, while the sent line is still on screen: the working lines that stream in afterwards push it above
# the fold of a keyboard-high thread, and a tap on an off-screen line leaves the keyboard up (the board has none).
# A tap on a bot line opens the Bot's profile, so it lands on the user's own bubble.
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*자기소개서도 같이 써 줘.*"
# The swipe that lowers the keyboard drags the thread up and the resumed run's working line falls below the fold, so the thread goes back to its end first.
- runFlow:
    file: _chat_bottom.yaml
- extendedWaitUntil:
    visible: ".*경력 수준을 비교하는 중.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatInterrupt

appId: app.push.mobile
name: BotNewLinkFinding
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- openLink: push://bots/new?mock=hang:POST:bots/link-preview
- extendedWaitUntil:
    visible: "이름"
    timeout: 20000
- tapOn: "회사, 공고, 링크로 찾아보세요"
- inputText: "careers.moapay.co.kr/jobs/1042"
- runFlow: _link_wait.yaml
# Both link states draw the same screen; the second wait gives the 1.2s check time to turn into the finding state.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: BotNewLinkFinding
- openLink: push://?mock=reset

appId: app.push.mobile
tags:
  - subflow
# Enter the 봇 tab, accept the reference-data consent when it is up, then open Push Bot's chat.
---
- retry:
    maxRetries: 3
    commands:
      - tapOn: "봇"
      - extendedWaitUntil:
          visible: "(동의하고 시작하기|새 회사 봇 만들기|Push Bot)"
          timeout: 6000
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
      - extendedWaitUntil:
          notVisible: "동의하고 시작하기"
          timeout: 10000
- openLink: push://bots/push
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- waitForAnimationToEnd

appId: app.push.mobile
name: 봇 홈 · 회사 봇 없음
tags:
  - visual
---
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on,bots:none"
      READY: "새로 올라온 공고"
- runFlow:
    file: ../flows/_tap_tab.yaml
    env:
      TAB: "Bot"
      READY: "Push Bot"
- extendedWaitUntil:
    visible: "Push Bot"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: AgentHomeNoBots

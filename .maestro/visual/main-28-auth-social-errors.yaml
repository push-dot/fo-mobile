appId: app.push.mobile
name: 로그인 → Google · Apple · GitHub 로그인 실패
tags:
  - visual
---
# The sign-in sheets of the three providers cannot run or fail on cue in a tour, so the mock makes each attempt fail:
# Google and GitHub start with GET auth/<provider>/start (the rule answers 500), Apple through mock=apple-fail.
# v415 board SignInErrors.5 is the Google failure alert over the sign-in screen; the board has no Apple or GitHub panel, so those shots keep their own names.
- clearKeychain
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Google로 시작하기"
    timeout: 60000
- runFlow: ../flows/_dismiss_logbox.yaml
- openLink: "push://sign-in?mock=fail:GET:auth/.*/start,apple-fail"
- waitForAnimationToEnd
- tapOn: "Google로 시작하기"
- extendedWaitUntil:
    visible: "Google 로그인에 실패했어요"
    timeout: 15000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: SignInErrors.5
- tapOn: "확인"
- tapOn: "Apple로 시작하기"
- extendedWaitUntil:
    visible: "Apple 로그인에 실패했어요"
    timeout: 15000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: SignInErrorsApple
- tapOn: "확인"
- tapOn: "GitHub로 시작하기"
- extendedWaitUntil:
    visible: "GitHub 로그인에 실패했어요"
    timeout: 15000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: SignInErrorsGitHub
- tapOn: "확인"
- openLink: push://?mock=reset

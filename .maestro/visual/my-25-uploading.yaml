appId: app.push.mobile
name: 마이 서류 → 파일 등록 → 올리는 중 (Uploading)
tags:
  - visual
---
# mock=pick-file: 파일에서 고르기 returns the resume PDF (the system file picker cannot be driven), and POST sources never answers,
# so the upload row stays on 올리는 중 (Uploading).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=pick-file,hang:POST:sources"
      READY: "새로 올라온 공고"
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "포트폴리오_결제시스템.pdf"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "파일 등록"
- extendedWaitUntil:
    visible: "서류 가져오기"
    timeout: 10000
- tapOn: "파일에서 고르기"
- extendedWaitUntil:
    visible: ".*올리는 중.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# The board shows the toast of the earlier upload over the row that is still going up. The app holds one upload at a time, so the
# link raises that toast (mock=upload-toast, shown 2.5 s) and the shot follows at once.
- openLink: push://my?mock=upload-toast
- extendedWaitUntil:
    visible: "이력서 파일을 올렸어요"
    timeout: 5000
- takeScreenshot: Uploading

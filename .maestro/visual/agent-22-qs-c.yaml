appId: app.push.mobile
name: 봇 · 빠른 시작 시트 (경험 · 답장 · 커피챗 · 글)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "경험 만들기"
      WAIT: "직접 입력하기"
      SHOT: QsExp
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "제안 답장 쓰기"
      WAIT: ".*결제 플랫폼팀 시니어 포지션으로.*"
      SHOT: QsReply
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "커피챗 제안 쓰기"
      WAIT: ".*김태윤.*"
      SHOT: QsCoffee
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "커리어 글 쓰기"
      WAIT: "직접 주제 정하기"
      SHOT: QsPost
# 전체 보기 opens the page-style modal with the whole list; its close button leaves it.
- runFlow:
    file: _pill.yaml
    env:
      LABEL: "제안 답장 쓰기"
      DIR: left
- tapOn: "제안 답장 쓰기"
- extendedWaitUntil:
    visible: "전체 보기"
    timeout: 15000
- tapOn: "전체 보기"
- extendedWaitUntil:
    visible: ".*강민호.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: QsReplyAll
- tapOn: "닫기"
- waitForAnimationToEnd
- runFlow:
    file: _pill.yaml
    env:
      LABEL: "커리어 글 쓰기"
      DIR: left
- tapOn: "커리어 글 쓰기"
- extendedWaitUntil:
    visible: "전체 보기"
    timeout: 15000
- tapOn: "전체 보기"
- extendedWaitUntil:
    visible: ".*면접에서 받은 질문 정리.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: QsPostAll

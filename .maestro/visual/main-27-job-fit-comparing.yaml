appId: app.push.mobile
name: 공고 상세 → 적합도 비교하는 중 (JobFit)
tags:
  - visual
---
# mock=fit-comparing makes the job page's WebView wait before it answers the fit (fo-web's WebView mock answers at once), so the card
# stays on 공고와 서류를 비교하는 중… for the shot (JobFit).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=fit-comparing"
      READY: "새로 올라온 공고"
- runFlow: _open_jobs.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- tapOn:
    text: ".*모아페이.*"
    index: 0
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*비교하는 중.*"
    timeout: 20000
- takeScreenshot: JobFit

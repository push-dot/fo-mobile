appId: app.push.mobile
name: ChatAccount
tags:
  - visual
---
# Bot home avatar opens /account (ChatAccount).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on"
      READY: "새로 올라온 공고"
- runFlow:
    file: ../flows/_tap_tab.yaml
    env:
      TAB: "Bot"
      READY: "(새 회사 Bot 만들기|Push Bot)"
- tapOn: "계정 · .*"
- extendedWaitUntil:
    visible: "Bot이 참고하는 내 정보"
    timeout: 10000
- extendedWaitUntil:
    visible: "이번 달 사용량 64%"
    timeout: 5000
- extendedWaitUntil:
    visible: "대화를 시작할 때 Bot이 이 정보부터 읽어요."
    timeout: 5000
- assertNotVisible: "ULTRA로 업그레이드"
- waitForAnimationToEnd
- takeScreenshot: ChatAccount
# The usage row opens ChatAccountUsage, one page deeper.
- tapOn: "이번 달 사용량 64%"
- extendedWaitUntil:
    visible: "크레딧 구매"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*월 1일에 다시 채워져요."
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ChatAccountUsage

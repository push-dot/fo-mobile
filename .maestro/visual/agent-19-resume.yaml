appId: app.push.mobile
name: 봇 · 작업 중이던 대화를 열어 이어서 작성
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# bot:b-moa:resume seeds the stored thread the board draws: the draft's review card that ran out (확인 대기 중 · 멈춤), then 새 이력서 만들어 줘, the bot's line and the resume offer.
- openLink: push://bots/b-moa?mock=bot:b-moa:resume
- extendedWaitUntil:
    visible: "이어서 작성할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatResume

appId: app.push.mobile
name: 봇 · 작업 중이던 대화를 열어 이어서 작성
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# run:resume-doc plays the interrupted-work scenario for the board's own line (b-dotori used to, but its pill reads 도토리증권).
- openLink: push://bots/b-moa?mock=run:resume-doc
- runFlow:
    file: _say.yaml
    env:
      KO: "새 이력서 만들어 줘"
      EN: "new resume"
- extendedWaitUntil:
    visible: "이어서 작성할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatResume

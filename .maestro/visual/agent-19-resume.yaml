appId: app.push.mobile
name: 봇 · 작업 중이던 대화를 열어 이어서 작성
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- openLink: push://bots/b-dotori
- extendedWaitUntil:
    visible: "메시지.*"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    file: _say.yaml
    env:
      KO: "새 이력서 만들어 줘"
      EN: "new resume"
- extendedWaitUntil:
    visible: "이어서 작성할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatResume

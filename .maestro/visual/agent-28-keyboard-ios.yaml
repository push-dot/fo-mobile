appId: app.push.mobile
name: 봇 · iOS 키보드가 떠 있을 때 입력창이 키보드 위 8px
tags:
  - visual
---
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ../flows/_login.yaml
      - runFlow: _company_tab.yaml
      - runFlow:
          file: _say_run.yaml
          env:
            RUN: "ext-done"
            BOT: "b-moa"
            KO: "이 이력서 더 좋게 고쳐 줘"
            EN: "Make this resume better"
      - extendedWaitUntil:
          visible: "프로필로 전환"
          timeout: 30000
      - waitForAnimationToEnd
      - runFlow: _dismiss_next.yaml
      - tapOn: "메시지.*"
      # The boards type Korean on iOS (ChatKeyboardIOS.1 one line, .2 two lines, .3 five lines).
      - inputText: "누리클라우드 공고에도 맞춰 줘"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardIOS.1
      - eraseText: 30
      - inputText: "모아페이 말고 누리클라우드 백엔드 공고에도 맞춰 줘. 경력기술서는 그대로 두고 이력서만 고쳐 줘"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardIOS.2
      - inputText: ". 승인 API 개선 성과는 맨 앞에 두고, Kafka 경험은 한 줄로 줄여 줘. 동아리 활동은 빼도 돼. 자기소개서는 다음에 따로 부탁할게"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardIOS.3

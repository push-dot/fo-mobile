appId: app.push.mobile
name: 봇 · iOS 키보드가 떠 있을 때 입력창이 키보드 위 8px
tags:
  - visual
---
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ../flows/_login.yaml
      - runFlow: _agent_tab.yaml
      - runFlow:
          file: _say.yaml
          env:
            KO: "ext-done"
            EN: "ext-done"
      - extendedWaitUntil:
          visible: "프로필로 전환"
          timeout: 30000
      - waitForAnimationToEnd
      - runFlow: _dismiss_next.yaml
      - tapOn: "메시지.*"
      - inputText: "Tailor it for Nuri Cloud too"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardIOS.1
      - takeScreenshot: ChatKeyboardIOS.3
      - inputText: " but leave my career statement as it is and only fix the resume, please"
      - waitForAnimationToEnd
      - takeScreenshot: ChatKeyboardIOS.2

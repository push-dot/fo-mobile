appId: app.push.mobile
name: 인증번호 틀림 · 만료 · 5번 초과
tags:
  - visual
---
# v415 board SignInErrors: 1 iOS + 2 Android wrong code, 3 iOS + 4 Android expired, 5 Google failure. An iOS run has no Android
# frame, so the even panel is shot in the same state right after the odd one (the earlier tour put the expired code on .2).
# The boards draw each error over a code cut back to 3 digits, so the tour erases after the error shows.
# The mock reads the code's tail: 482111 wrong, 482222 expired, 482333 too many tries (mock/home.ts).
- runFlow: _phone_code.yaml
- inputText: "482111"
- runFlow: _hide_kbd.yaml
- tapOn: "확인"
- extendedWaitUntil:
    visible: "인증번호가 맞지 않아요.*"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "인증번호"
      - eraseText: 3
      - runFlow: _hide_kbd.yaml
      - takeScreenshot: SignInErrors.1
      - takeScreenshot: SignInErrors.2
- tapOn: "번호 바꾸기"
- tapOn: "인증번호 받기"
- extendedWaitUntil:
    visible: "인증번호를 입력해 주세요"
    timeout: 10000
- inputText: "482222"
- runFlow: _hide_kbd.yaml
- tapOn: "확인"
- extendedWaitUntil:
    visible: "인증번호가 만료됐어요.*"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "인증번호"
      - eraseText: 3
      - runFlow: _hide_kbd.yaml
      - takeScreenshot: SignInErrors.3
      - takeScreenshot: SignInErrors.4
- tapOn: "번호 바꾸기"
- tapOn: "인증번호 받기"
- extendedWaitUntil:
    visible: "인증번호를 입력해 주세요"
    timeout: 10000
- inputText: "482333"
- runFlow: _hide_kbd.yaml
- tapOn: "확인"
- extendedWaitUntil:
    visible: "인증번호를 5번 잘못 입력했어요"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: AuthCodeLimit

appId: app.push.mobile
name: 봇 · 피드백 → 수정 전략 → 초안 → 초안 검토 → 점수 올리기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# ChatPh1Feedback draws the feedback card right under 피드백만 받을게요, without the analysis above it (mock token on Android).
- runFlow:
    file: _say.yaml
    env:
      KO: "피드백만 받을게요"
      EN: "feedback only"
- extendedWaitUntil:
    visible: "피드백을 반영해서 수정할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1Feedback
# Each phase board draws its thread under its own user line and without the earlier phases, so each one jumps there in a fresh conversation (mock tokens).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 맞춰서 고쳐 주세요"
      EN: "ph2"
- extendedWaitUntil:
    visible: "이 전략대로 초안을 쓸까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh2
- tapOn: ".*초안 쓸게요"
- extendedWaitUntil:
    visible: "첫 번째 초안.v1.이에요.*"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh3Review
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "boost"
- extendedWaitUntil:
    visible: "점수를 한 번 더 올릴까요?"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh3Boost
# ChatPh3BoostStop draws two stops under the same boost line (panel 1 and 2 are the first on iOS light and dark, panel 3 the second on Android, so the shots are .1 and .3): all five rounds used,
# and the score stuck early. Each is played through run: for the board's own user line, so no 한 번 더 올리기 answer sits between the card and the stop line.
# Both runs end on the stop line, so nothing runs or waits under it.
- runFlow: _fresh_company.yaml
- openLink: push://bots/b-moa?mock=run:boost-max
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "ok, continue"
- extendedWaitUntil:
    visible: ".*최대 5번까지 올렸어요.*"
    timeout: 40000
- waitForAnimationToEnd
# The board has no keyboard (the thread still holds the one _say left up): lower it before the shot. The tap lands on the user's own line:
# a tap on a bot line opens the Bot's profile (agent-07, agent-15).
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*좋아요, 계속해 주세요.*"
- takeScreenshot: ChatPh3BoostStop.1
- runFlow: _fresh_company.yaml
# run:boost-stuck plays the stuck run for the board's own user line, so no mock token shows in the bubble.
- openLink: push://bots/b-moa?mock=run:boost-stuck
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "ok, continue"
- extendedWaitUntil:
    visible: ".*더 올리기 어려워서 여기서 멈출게요.*"
    timeout: 40000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*좋아요, 계속해 주세요.*"
- takeScreenshot: ChatPh3BoostStop.3
# The writing state holds for a minute (to-do 1/5, the draft card streaming), so this one goes last.
- runFlow: _fresh_company.yaml
- openLink: push://bots/b-moa?mock=run:ph3-write
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 써 주세요"
      EN: "ph3-write"
# ChatPh3 draws the writing state with the keyboard down, so the 할 일 card above the draft is in view.
# The running line sits in the thread between the 할 일 card and the draft; the user line has scrolled above by now.
- extendedWaitUntil:
    visible: ".*경력 섹션을 쓰는 중.*"
    timeout: 30000
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*경력 섹션을 쓰는 중.*"
- waitForAnimationToEnd
- takeScreenshot: ChatPh3

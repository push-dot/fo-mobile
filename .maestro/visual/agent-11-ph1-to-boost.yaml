appId: app.push.mobile
name: 봇 · 피드백 → 수정 전략 → 초안 → 초안 검토 → 점수 올리기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# ChatPh1Feedback draws the feedback card right under 피드백만 받을게요, without the analysis above it (mock token on Android).
- runFlow:
    file: _say.yaml
    env:
      KO: "피드백만 받을게요"
      EN: "feedback only"
- extendedWaitUntil:
    visible: "피드백을 반영해서 수정할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1Feedback
# Each phase board draws its thread under its own user line and without the earlier phases, so each one jumps there in a fresh conversation (mock tokens).
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 맞춰서 고쳐 주세요"
      EN: "ph2"
- extendedWaitUntil:
    visible: "이 전략대로 초안을 쓸까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh2
- tapOn: ".*초안 쓸게요"
- extendedWaitUntil:
    visible: "첫 번째 초안.v1.이에요.*"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh3Review
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "boost"
- extendedWaitUntil:
    visible: "점수를 한 번 더 올릴까요?"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh3Boost
# ChatPh3BoostStop draws two stops under the same boost line (panel 1 and 2 are the first on iOS light and dark, panel 3 the second on Android, so the shots are .1 and .3): all five rounds used (한 번 더 올리기 answers the card), and the score stuck early
# (the boost-stuck run, played through run: for the board's own user line). The quality card hides the chat from accessibility, so the mock holds it back
# for 20 s after the stop line and the shot is taken first.
- runFlow:
    file: _pick.yaml
    env:
      ASK: "점수를 한 번 더 올릴까요?"
      PICK: ".*한 번 더 올리기"
      NEXT: ".*최대 5번까지 올렸어요.*"
- waitForAnimationToEnd
- takeScreenshot: ChatPh3BoostStop.1
# The run is still going (the quality card follows after the hold): let it reach its card before the chat is reset, or the next line queues behind it.
# optional: the card sometimes opens blank (the hierarchy holds nothing, an app defect in STEP2-REMAINDER-DEFECTS), and the tour goes on.
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 40000
    optional: true
- runFlow: _fresh_company.yaml
# run:boost-stuck plays the stuck run for the board's own user line, so no mock token shows in the bubble.
- openLink: push://bots/b-moa?mock=run:boost-stuck
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "ok, continue"
- extendedWaitUntil:
    visible: ".*더 올리기 어려워서 여기서 멈출게요.*"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3BoostStop.3
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 40000
    optional: true
# The writing state holds for a minute (to-do 1/5, the draft card streaming), so this one goes last.
- runFlow: _fresh_company.yaml
- openLink: push://bots/b-moa?mock=run:ph3-write
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 써 주세요"
      EN: "ph3-write"
- extendedWaitUntil:
    visible: ".*경력 섹션을 쓰는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3

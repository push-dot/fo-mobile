appId: app.push.mobile
name: 봇 · 피드백 → 수정 전략 → 초안 → 초안 검토 → 점수 올리기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
# ChatPh1Feedback draws the feedback card right under 피드백만 받을게요, without the analysis above it (mock token on Android).
- runFlow:
    file: _say.yaml
    env:
      KO: "피드백만 받을게요"
      EN: "feedback only"
- extendedWaitUntil:
    visible: "피드백을 반영해서 수정할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1Feedback
# Each phase board draws its thread under its own user line and without the earlier phases, so each one jumps there in a fresh conversation (mock tokens).
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 맞춰서 고쳐 주세요"
      EN: "ph2"
- extendedWaitUntil:
    visible: "이 전략대로 초안을 쓸까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh2
- tapOn: ".*초안 쓸게요"
- extendedWaitUntil:
    visible: "첫 번째 초안.v1.이에요.*"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh3Review
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "boost"
- extendedWaitUntil:
    visible: "점수를 한 번 더 올릴까요?"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh3Boost
# ChatPh3BoostStop draws two stops under the same boost line: all five rounds used (한 번 더 올리기 answers the card), and the score stuck early
# (the boost-stuck token, typed as is on both platforms). The quality check streams in right after the stop line, so wait it out and scroll back up to the line.
- runFlow:
    file: _pick.yaml
    env:
      ASK: "점수를 한 번 더 올릴까요?"
      PICK: ".*한 번 더 올리기"
      NEXT: ".*최대 5번까지 올렸어요.*"
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*최대 5번까지 올렸어요.*"
    direction: UP
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3BoostStop
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "boost-stuck"
      EN: "boost-stuck"
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 40000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*더 올리기 어려워서 여기서 멈출게요.*"
    direction: UP
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3BoostStop.2
# The writing state holds for a minute (to-do 1/5, the draft card streaming), so this one goes last.
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 써 주세요"
      EN: "ph3-write"
- extendedWaitUntil:
    visible: ".*경력 섹션을 쓰는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3

appId: app.push.mobile
name: 봇 · 외부 파일 완료 (저장됨 · 공고 없음 · 저장 실패) + 결과 확인 + 더 보기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-done"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "프로필로 전환"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatDoneNext
- runFlow: _dismiss_next.yaml
- takeScreenshot: ChatDone
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-nosave"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "모아페이에 바로 지원하기"
    timeout: 30000
- waitForAnimationToEnd
- runFlow: _dismiss_next.yaml
# The board's thread starts at the to-do card: the user line and the greeting are older turns.
- openLink: push://bots/b-moa?mock=bot:b-moa:from:todo
- waitForAnimationToEnd
- takeScreenshot: ChatDoneSaveFail
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-ok"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "내 서류에 저장했어요. 결과를 확인할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh6ResultFile
- runFlow: _fresh_company.yaml
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-fail"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "내 서류에 저장하지 못했어요. 결과를 확인할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh6ResultFail
# ChatDoneNoJob draws no company (logo-only pill), so it runs last, in the Push Bot.
- openLink: push://bots/push?mock=consent-on,bot:push:empty
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 15000
- waitForAnimationToEnd
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-nojob"
      BOT: "push"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
# The finished run asks ChatDoneNext at once and the action sheet hides the thread from the accessibility tree: wait for either, then close it.
- extendedWaitUntil:
    visible: "(다음으로 무엇을 할까요\\?|.*김서준_백엔드_이력서_수정본.pdf.*)"
    timeout: 30000
- waitForAnimationToEnd
- runFlow: _dismiss_next.yaml
- extendedWaitUntil:
    visible: ".*김서준_백엔드_이력서_수정본.pdf.*"
    timeout: 10000
- takeScreenshot: ChatDoneNoJob

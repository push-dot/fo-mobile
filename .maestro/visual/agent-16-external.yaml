appId: app.push.mobile
name: 봇 · 외부 파일 완료 (저장됨 · 공고 없음 · 저장 실패) + 결과 확인 + 더 보기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow: _fresh_company.yaml
- runFlow:
    file: _from.yaml
    env:
      BOT: "b-moa"
      FROM: "todo"
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-done"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "프로필로 전환"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatDoneNext
- runFlow: _dismiss_next.yaml
- takeScreenshot: ChatDone
- runFlow: _fresh_company.yaml
- runFlow:
    file: _from.yaml
    env:
      BOT: "b-moa"
      FROM: "todo"
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-nosave"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
# A file the bot could not save is told in the bot's own bubble with 다시 저장하기 ›, and the run asks no ChatDoneNext modal.
- extendedWaitUntil:
    visible: "다시 저장하기"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatDoneSaveFail
- runFlow: _fresh_company.yaml
- runFlow:
    file: _from.yaml
    env:
      BOT: "b-moa"
      FROM: "agentText"
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-ok"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "김서준_모아페이_백엔드.*"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    file: _chat_kbd_down.yaml
- takeScreenshot: ChatPh6ResultFile
- runFlow: _fresh_company.yaml
- runFlow:
    file: _from.yaml
    env:
      BOT: "b-moa"
      FROM: "agentText"
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-fail"
      BOT: "b-moa"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
- extendedWaitUntil:
    visible: "다시 저장하기"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh6ResultFail
- extendedWaitUntil:
    visible: "김서준_모아페이_백엔드.*"
    timeout: 10000
# ChatDoneNoJob draws no company (logo-only pill), so it runs last, in the Push Bot.
- openLink: push://bots/push?mock=consent-on,bot:push:empty
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 15000
- waitForAnimationToEnd
- runFlow:
    file: _from.yaml
    env:
      BOT: "push"
      FROM: "todo"
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "ext-nojob"
      BOT: "push"
      KO: "이 이력서 더 좋게 고쳐 줘"
      EN: "Make this resume better"
# The finished run asks ChatDoneNext at once and the action sheet hides the thread from the accessibility tree: wait for either, then close it.
- extendedWaitUntil:
    visible: "(다음으로 무엇을 할까요?|.*김서준_백엔드_이력서_수정본.*)"
    timeout: 30000
- waitForAnimationToEnd
- runFlow: _dismiss_next.yaml
- extendedWaitUntil:
    visible: ".*김서준_백엔드_이력서_수정본.*"
    timeout: 10000
- takeScreenshot: ChatDoneNoJob

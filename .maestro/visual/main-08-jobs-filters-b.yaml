appId: app.push.mobile
name: 채용공고 → 기술 스택 · 지역 · 고용형태 필터 · 빈 상태
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _open_jobs.yaml
- tapOn: "기술 스택"
- extendedWaitUntil:
    visible: "내 프로필 기술"
    timeout: 10000
- tapOn: "Kotlin"
- tapOn: "Spring Boot"
- tapOn: "Kafka"
- extendedWaitUntil:
    visible: "공고 214개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterSkill
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 214개 보기"
- tapOn: "전체"
- waitForAnimationToEnd
# 지역 is two wheels (시·도, 구): tapping a wheel row selects it, 추가 turns the pick into a chip.
- tapOn: "지역"
- tapOn: "강남구"
- tapOn: "추가"
- tapOn: "서초구"
- tapOn: "추가"
- tapOn: "마포구"
- tapOn: "추가"
- extendedWaitUntil:
    visible: "공고 398개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterRegion
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 398개 보기"
- tapOn: "전체"
- waitForAnimationToEnd
- runFlow: _scroll_chips.yaml
- tapOn: "고용형태"
- tapOn: "정규직"
- extendedWaitUntil:
    visible: "공고 1,021개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterType

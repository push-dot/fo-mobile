appId: app.push.mobile
name: 채용공고 → 기술 스택 · 지역 · 고용형태 필터 · 빈 상태
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _open_jobs.yaml
- tapOn: "기술 스택"
- extendedWaitUntil:
    visible: "내 프로필 기술"
    timeout: 10000
- tapOn: "Kotlin"
- tapOn: "Spring Boot"
- tapOn: "Kafka"
- extendedWaitUntil:
    visible: "공고 214개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterSkill
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 214개 보기"
# 전체 resets the filters; the list total proves it did (1,284 with no filter), so the next sheet starts from an empty draft. A skill
# still set would turn the three-district total into the fixture count (공고 2개) instead of the board's 398.
- retry:
    maxRetries: 2
    commands:
      - tapOn: "전체"
      - extendedWaitUntil:
          visible: "공고 1,284개"
          timeout: 5000
- waitForAnimationToEnd
# iOS merges a row's label and count into one element, Android keeps them apart.
- tapOn: "지역"
- tapOn: "강남구(.*214)?"
- tapOn: "서초구(.*96)?"
- tapOn: "마포구(.*88)?"
- extendedWaitUntil:
    visible: "공고 398개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterRegion
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 398개 보기"
# 전체 resets the filters; the list total proves it did (1,284 with no filter), so the next sheet starts from an empty draft. A skill
# still set would turn the three-district total into the fixture count (공고 2개) instead of the board's 398.
- retry:
    maxRetries: 2
    commands:
      - tapOn: "전체"
      - extendedWaitUntil:
          visible: "공고 1,284개"
          timeout: 5000
- waitForAnimationToEnd
# 고용형태 is off the chip row's screen, and scrolling the row would leave it scrolled behind the sheet. FilterType draws the row at
# its start, so the sheet opens by its own route over the list instead.
- openLink: push://job-filter?kind=employmentType
- extendedWaitUntil:
    visible: "정규직"
    timeout: 10000
- tapOn: "정규직"
- extendedWaitUntil:
    visible: "공고 1,021개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterType

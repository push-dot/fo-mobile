appId: app.push.mobile
name: 회사 봇 · 처음 열기(빠른 시작) · 내 자료 읽기 꺼짐
tags:
  - visual
---
# bot:b-moa:empty is a 모아페이 bot that has not said a word, so the chat opens on its greeting and four quick starts (ChatBotOnboard).
# run:read-off answers the next message with the refusal notice a switched-off 내 자료 읽기 gets (ChatBotReadOff).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on,bot:b-moa:empty,run:read-off"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-moa
- extendedWaitUntil:
    visible: "적합도 보기"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ChatBotOnboard
- runFlow:
    file: _say.yaml
    env:
      KO: "제 이력서 보고 모아페이 공고에 맞게 고쳐 주세요"
      EN: "read-off"
- extendedWaitUntil:
    visible: ".*내 자료 읽기가 꺼져 있어서.*"
    timeout: 20000
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*내 자료 읽기가 꺼져 있어서.*"
- waitForAnimationToEnd
- takeScreenshot: ChatBotReadOff

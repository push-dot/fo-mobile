appId: app.push.mobile
name: 회사 봇 · 새 메시지 알림 (ChatBotHeaderNew)
tags:
  - visual
---
# The reader scrolls up in a finished chat, then a bot answer lands (bot:b-moa:late, three times): the header avatar gets the green dot and the
# thread shows the 새 메시지 1개 pill (ChatBotHeaderNew).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on,bot:b-moa:thread"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-moa
- extendedWaitUntil:
    visible: ".*경력 섹션 3줄을 고쳤어요.*"
    timeout: 20000
# The seeded thread fits the screen and one late answer overflows it by less than AT_BOTTOM (40 pt), which still counts as the bottom, so
# two answers make the thread long enough to scroll past it. Then the reader scrolls up, and the third lands while the thread is away from the bottom.
- openLink: push://bots/b-moa?mock=bot:b-moa:late
- waitForAnimationToEnd
- openLink: push://bots/b-moa?mock=bot:b-moa:late
- waitForAnimationToEnd
# The third answer is timed in the link (6 s), so no link opens after the scroll-up.
- openLink: push://bots/b-moa?mock=bot:b-moa:late:6000
- waitForAnimationToEnd
- swipe:
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    visible: "새 메시지 1개"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatBotHeaderNew

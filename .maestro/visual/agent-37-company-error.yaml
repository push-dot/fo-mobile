appId: app.push.mobile
name: 회사 봇 · 오류 상태 줄 (작업 중 문제가 생겼어요 · 연결 끊김)
tags:
  - visual
---
# run:err-disconnect makes the next message end in an error frame with the reason 연결 끊김 (ChatBotStatusError).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=consent-on,bot:b-moa:empty,run:err-disconnect"
      READY: "새로 올라온 공고"
- openLink: push://bots/b-moa
- extendedWaitUntil:
    visible: "적합도 보기"
    timeout: 15000
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력 섹션을 고쳐 주세요"
      EN: "err-disconnect"
- extendedWaitUntil:
    visible: "작업 중 문제가 생겼어요.*"
    timeout: 20000
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*경력 섹션을 고쳐 주세요.*"
- waitForAnimationToEnd
- takeScreenshot: ChatBotStatusError

appId: app.push.mobile
name: 봇 · 품질 검사 → 템플릿 고르기 → PDF 만들기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# ChatPh4Quality draws the quality check right under 품질 검사로 넘어가기, with no boost card above, so the token jumps there.
- runFlow:
    file: _say.yaml
    env:
      KO: "품질 검사로 넘어가기"
      EN: "quality"
# The approval card opens blank when it comes up while the keyboard is still raised (the hierarchy then holds nothing), so lower it first.
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*품질 검사로 넘어가기.*"
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh4Quality
- tapOn: "2개 반영하고 디자인으로"
- extendedWaitUntil:
    visible: "검증을 마쳤어요. 어떤 디자인을 적용할까요?"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "프로필 사진 넣기"
- takeScreenshot: ChatPh4Design
# ChatPh5 runs in the thread that came here through the review and the design card: the composer says 작업 중에도 말할 수 있어요 only
# while a document flow works, and that is known from the flow's cards above the line, so the card's own button answers (its answer
# line is 클래식으로 만들기, as the board's). No keyboard is up (nothing was typed).
- tapOn: "클래식으로 만들기"
- extendedWaitUntil:
    visible: ".*Push 프로필에 저장하는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh5

appId: app.push.mobile
name: 봇 · 품질 검사 → 템플릿 고르기 → PDF 만들기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
- runFlow: _fresh_company.yaml
# An earlier turn of the flow (its to-do card): the composer says 작업 중에도 말할 수 있어요 on ChatPh5 because the thread holds the flow's cards.
- runFlow:
    file: _say_run.yaml
    env:
      RUN: "flow-history"
      BOT: "b-moa"
      KO: "이력서 고쳐 줘"
      EN: "flow-history"
- extendedWaitUntil:
    visible: ".*공고 요건 정리.*"
    timeout: 20000
# Each board below starts at the user's latest line: the greeting and the turns before it are older.
- runFlow:
    file: _from.yaml
    env:
      BOT: "b-moa"
      FROM: "user:last"
# ChatPh4Quality draws the quality check right under 품질 검사로 넘어가기, with no boost card above, so the token jumps there.
- runFlow:
    file: _say.yaml
    env:
      KO: "품질 검사로 넘어가기"
      EN: "quality"
# The keyboard comes down while the run still works (the first line follows after a pause).
- runFlow:
    file: _chat_kbd_down.yaml
# The recommended fixes are applied without asking: the run says so, ends on 이제 디자인을 고를게요. and shows no status line after it.
- extendedWaitUntil:
    visible: ".*이제 디자인을 고를게요.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ChatPh4Quality
# The design is the next turn: the user's line, the bot's sentence, then the design modal (the keyboard comes down before it opens).
- runFlow:
    file: _say.yaml
    env:
      KO: "2개 반영하고 디자인으로"
      EN: "design"
- runFlow:
    file: _chat_kbd_down.yaml
- extendedWaitUntil:
    visible: "클래식으로 만들기"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: ChatPh4Design
# ChatPh5 runs in the thread that came here through the review and the design modal: the composer says 작업 중에도 말할 수 있어요 only
# while a document flow works, and that is known from the flow's cards above the line, so the modal's own button answers (its answer
# line is 클래식으로 만들기, as the board's). No keyboard is up (nothing was typed).
- tapOn: "클래식으로 만들기"
- extendedWaitUntil:
    visible: ".*Push 프로필에 저장하는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh5

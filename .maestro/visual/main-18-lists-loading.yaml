appId: app.push.mobile
name: 채용공고 · 허브 · 소셜 불러오는 중
tags:
  - visual
---
# One login with the three lists held back (GET postings, profiles, posts); each list is opened for the first time under its rule.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=hang:GET:postings,hang:GET:profiles,hang:GET:posts"
      READY: "채용공고"
- tapOn:
    text: "채용공고"
    index: 0
- extendedWaitUntil:
    visible: "뒤로"
    timeout: 10000
- assertNotVisible: "공고 .*개"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: JobListLoading.1
      - takeScreenshot: JobListLoading.2
- tapOn: "뒤로"
- tapOn: "허브"
- extendedWaitUntil:
    visible: "추천 프로필"
    timeout: 10000
- assertNotVisible: ".*김태윤.*"
# The board draws the loading rows under the same filters as Hub (개발·데이터, 3–5년, 이직/구직중: filter badge 2), so apply them first;
# the chips and the sheet stay up while the list loads. The sheet's button has no count yet (the count comes from the held list).
- tapOn: "개발"
- tapOn: "데이터"
- tapOn: "필터"
- extendedWaitUntil:
    visible: "재직 기간"
    timeout: 10000
- tapOn: "3.5년"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "이직/구직중"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "이직/구직중"
          below: "커리어 상태"
- waitForAnimationToEnd
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "프로필 .*보기"
- extendedWaitUntil:
    notVisible: "재직 기간"
    timeout: 10000
- assertNotVisible: ".*김태윤.*"
- waitForAnimationToEnd
- takeScreenshot: HubLoading
- tapOn: "소셜"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- assertNotVisible: ".*3년차 백엔드.*"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: SocialLoading.1
      - takeScreenshot: SocialLoading.2
- openLink: push://?mock=reset

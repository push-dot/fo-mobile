appId: app.push.mobile
name: 봇 · 작업 중 + 대기 중인 말
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _company_tab.yaml
# run:tailor hold plays the held run for the typed line, so the working line stays up for the screenshot on iOS too.
# pick-file makes 파일에서 고르기 return the resume PDF: ChatStates.3 draws it as the file chip inside the first user bubble (iOS).
- openLink: push://bots/b-moa?mock=run:tailor%20hold,pick-file
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "첨부"
      - extendedWaitUntil:
          visible: "자료 고르기"
          timeout: 10000
      # The sheet lists the documents first; 파일에서 고르기 is the last row, below the fold.
      - scrollUntilVisible:
          element: "파일에서 고르기"
          direction: DOWN
          timeout: 20000
      - tapOn: "파일에서 고르기"
      - extendedWaitUntil:
          notVisible: "자료 고르기"
          timeout: 10000
      - waitForAnimationToEnd
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor hold"
- extendedWaitUntil:
    visible: ".*기술 스택을 비교하는 중.*"
    timeout: 40000
- runFlow:
    file: _say.yaml
    env:
      KO: "경력은 숫자 위주로 써 주세요"
      EN: "use numbers"
- extendedWaitUntil:
    visible: ".*대기 중.*"
    timeout: 10000
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*대기 중.*"
- takeScreenshot: ChatWorking
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: ChatStates.3
